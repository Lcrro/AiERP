<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>ERP Agent 项目模块地图</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --text: #1f2933;
      --muted: #64707d;
      --line: #d8e0e8;
      --line-strong: #aebac7;
      --runtime: #2563eb;
      --tool: #0f766e;
      --erp: #7c3aed;
      --material: #ca8a04;
      --scenario: #dc2626;
      --governance: #64748b;
      --done: #15803d;
      --active: #b45309;
      --planned: #64748b;
      --shadow: 0 14px 36px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input, select { font: inherit; }

    .app {
      height: 100vh;
      min-height: 720px;
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
    }

    header {
      padding: 18px 22px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    .title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
      white-space: nowrap;
    }

    .layout {
      min-height: 0;
      display: grid;
      grid-template-columns: 285px minmax(620px, 1fr) 360px;
      gap: 14px;
      padding: 14px 22px 22px;
    }

    .panel {
      min-height: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .panel-head {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfd;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .panel-head h2 {
      margin: 0;
      font-size: 15px;
      line-height: 1.2;
    }

    .panel-body {
      min-height: 0;
      overflow: auto;
      padding: 14px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .field {
      height: 38px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
      display: flex;
      align-items: center;
    }

    .field svg {
      width: 16px;
      height: 16px;
      margin-left: 10px;
      color: var(--muted);
      flex: 0 0 auto;
    }

    input, select {
      width: 100%;
      height: 100%;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
      padding: 0 10px;
      min-width: 0;
    }

    .layer-list,
    .legend-list,
    .metric-list {
      display: grid;
      gap: 8px;
    }

    .layer-button {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--panel-soft);
      border-radius: 8px;
      padding: 10px 11px;
      text-align: left;
      cursor: pointer;
      color: var(--text);
    }

    .layer-button:hover,
    .layer-button.active {
      border-color: var(--line-strong);
      background: #eef6ff;
    }

    .layer-title {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-weight: 700;
      font-size: 13px;
    }

    .layer-desc {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      display: inline-block;
      flex: 0 0 auto;
    }

    .legend-row,
    .metric-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 30px;
      padding: 6px 0;
      color: var(--muted);
      font-size: 12px;
      border-bottom: 1px solid #eef2f6;
    }

    .legend-row span:first-child {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--text);
    }

    .map-panel {
      position: relative;
      min-width: 0;
    }

    .map-toolbar {
      position: absolute;
      z-index: 5;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
    }

    .map-toolbar button {
      height: 34px;
      min-width: 34px;
      padding: 0 10px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--text);
      cursor: pointer;
    }

    .map-toolbar button:hover {
      border-color: var(--runtime);
      color: var(--runtime);
    }

    .map-wrap {
      flex: 1;
      min-height: 0;
      position: relative;
      background:
        linear-gradient(#e6edf4 1px, transparent 1px),
        linear-gradient(90deg, #e6edf4 1px, transparent 1px),
        #f9fbfd;
      background-size: 40px 40px;
      cursor: grab;
      overflow: hidden;
    }

    .map-wrap.dragging { cursor: grabbing; }

    svg.map {
      width: 100%;
      height: 100%;
      display: block;
      user-select: none;
    }

    .edge {
      fill: none;
      stroke: #9aa8b7;
      stroke-width: 2.2;
      stroke-linecap: round;
      opacity: 0.54;
    }

    .edge.flow { stroke: #2563eb; }
    .edge.guard { stroke: #dc2626; stroke-dasharray: 8 8; }
    .edge.data { stroke: #0f766e; }
    .edge.doc { stroke: #64748b; stroke-dasharray: 3 7; }

    .edge.dim,
    .node.dim { opacity: 0.3; }

    .edge.active {
      opacity: 0.95;
      stroke-width: 3.5;
    }

    .node {
      cursor: pointer;
      transition: opacity 0.16s ease;
    }

    .node circle.main {
      stroke: #ffffff;
      stroke-width: 4;
      filter: drop-shadow(0 8px 14px rgba(15, 23, 42, 0.15));
    }

    .node circle.ring {
      fill: none;
      stroke-width: 2;
      opacity: 0.65;
    }

    .node text {
      font-size: 13px;
      font-weight: 720;
      fill: #17202a;
      text-anchor: middle;
      pointer-events: none;
      letter-spacing: 0;
    }

    .node .small {
      font-size: 11px;
      font-weight: 600;
      fill: #536171;
    }

    .node.selected circle.main {
      stroke: #111827;
      stroke-width: 5;
    }

    .node:hover circle.main { stroke: #111827; }

    .zone-label {
      fill: #64748b;
      font-size: 13px;
      font-weight: 700;
      text-anchor: middle;
      pointer-events: none;
    }

    .detail-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .detail-title h3 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 12px;
      color: #243244;
      background: #eef2f6;
      white-space: nowrap;
    }

    .pill.done {
      color: #166534;
      background: #dcfce7;
    }

    .pill.active {
      color: #92400e;
      background: #fef3c7;
    }

    .pill.planned {
      color: #475569;
      background: #e2e8f0;
    }

    .detail-copy {
      color: var(--muted);
      margin: 8px 0 16px;
    }

    .section { margin-top: 16px; }

    .section h4 {
      margin: 0 0 8px;
      font-size: 13px;
      color: #334155;
    }

    .list {
      display: grid;
      gap: 7px;
    }

    .item {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 10px;
      background: var(--panel-soft);
      font-size: 12px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .item strong {
      display: block;
      color: var(--text);
      font-size: 13px;
      margin-bottom: 2px;
    }

    .empty {
      color: var(--muted);
      font-size: 13px;
    }

    .footer-note {
      margin-top: 14px;
      padding: 10px;
      border-radius: 8px;
      background: #f8fafc;
      color: var(--muted);
      font-size: 12px;
      border: 1px solid var(--line);
    }

    @media (max-width: 1180px) {
      .app {
        height: auto;
        min-height: 100vh;
        overflow: auto;
      }

      .layout { grid-template-columns: 1fr; }
      .map-panel { min-height: 680px; }
      .map-wrap { min-height: 620px; }
      .meta { white-space: normal; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title-row">
        <div>
          <h1>ERP Agent 项目模块地图</h1>
          <div class="subtitle">用圆点和连线查看当前项目各模块的依赖、数据流、控制边界和下一步建设重点。</div>
        </div>
        <div class="meta">
          当前视图：工程关系图<br>
          数据口径：2026-07-04 项目状态
        </div>
      </div>
    </header>

    <section class="layout">
      <aside class="panel">
        <div class="panel-head">
          <h2>筛选</h2>
          <span class="pill" id="visibleCount">0 个节点</span>
        </div>
        <div class="panel-body">
          <div class="toolbar">
            <label class="field" title="按模块名称、职责或文件搜索">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M10.8 18.1a7.3 7.3 0 1 1 5.2-2.1l4 4-1.4 1.4-4-4a7.3 7.3 0 0 1-3.8 1.1Zm0-2a5.3 5.3 0 1 0 0-10.6 5.3 5.3 0 0 0 0 10.6Z" fill="currentColor"/>
              </svg>
              <input id="searchInput" placeholder="搜索：物料、ToolCall、Adapter、沙盘">
            </label>
            <label class="field">
              <select id="statusFilter" title="按完成状态筛选">
                <option value="all">全部状态</option>
                <option value="done">已完成基线</option>
                <option value="active">正在建设</option>
                <option value="planned">后续规划</option>
              </select>
            </label>
          </div>

          <div class="section">
            <h4>层级</h4>
            <div class="layer-list" id="layerList"></div>
          </div>

          <div class="section">
            <h4>连线类型</h4>
            <div class="legend-list">
              <div class="legend-row"><span><span class="dot" style="background:#2563eb"></span>执行流</span><span>自然语言到 ERP 操作</span></div>
              <div class="legend-row"><span><span class="dot" style="background:#0f766e"></span>数据依赖</span><span>主数据、上下文、结果</span></div>
              <div class="legend-row"><span><span class="dot" style="background:#dc2626"></span>控制边界</span><span>权限、确认、网关</span></div>
              <div class="legend-row"><span><span class="dot" style="background:#64748b"></span>文档/验证</span><span>说明、测试、沙盘</span></div>
            </div>
          </div>

          <div class="section">
            <h4>状态统计</h4>
            <div class="metric-list" id="metricList"></div>
          </div>
        </div>
      </aside>

      <section class="panel map-panel">
        <div class="panel-head">
          <h2>模块关系图</h2>
          <span class="pill">拖拽移动，滚轮缩放，点击圆点查看详情</span>
        </div>
        <div class="map-toolbar">
          <button id="zoomOut" title="缩小">-</button>
          <button id="zoomIn" title="放大">+</button>
          <button id="resetView" title="重置视图">重置</button>
        </div>
        <div class="map-wrap" id="mapWrap">
          <svg class="map" id="mapSvg" viewBox="0 0 1800 1080" role="img" aria-label="ERP Agent 项目模块关系图"></svg>
        </div>
      </section>

      <aside class="panel">
        <div class="panel-head">
          <h2>模块详情</h2>
          <span class="pill" id="selectedLayer">未选择</span>
        </div>
        <div class="panel-body" id="detailPane">
          <div class="empty">点击地图中的任意圆点，查看它的职责、主要文件、上游输入和下游输出。</div>
        </div>
      </aside>
    </section>
  </div>

      node("material_resolver", "物料 Resolver", "人话到 SKU", "material", "active", 520, 725, 61, "把“帆布手套”“6.8级螺栓 M12*40”等人话物料词解析成候选或唯一 SKU。高置信才进入 ToolCall。", ["src/nexterp_agent/item_master/release_resolver.py", "tests/unit/item_master/test_release_material_resolver.py"], ["raw_item_text", "结构化规格", "发布版物料表"], ["ready", "needs_confirmation", "not_found"]),
      node("material_governance", "物料治理脚本", "分类/SKU/发布", "material", "active", 145, 830, 55, "从原始采购清单到治理表、人工映射、DeepSeek SKU 治理、发布版构建的一组脚本。", ["scripts/material_master", "docs/reference/material-sku-governance-prompt-v0.3.md"], ["原始清单", "人工规则", "DeepSeek 输出"], ["治理中间表", "发布版物料表"]),
      node("scenario_day", "一天业务沙盘", "小型土木公司", "scenario", "active", 585, 880, 56, "按 08:00 到 18:00 的真实业务顺序验证采购、库存、退货、领料、财务和管理层摘要。", ["docs/scenarios/civil-company-day-events.md", "docs/scenarios/civil-company-day-execution-log.md"], ["员工角色", "项目仓库", "物料与供应商"], ["端到端业务验证", "缺失 ToolCall 清单"]),
      node("wizard", "Wizard 测试台", "手动扮演 Agent", "scenario", "done", 760, 905, 50, "在真正接入完整 Agent Runtime 前，由人点击 ToolCall 验证业务流程是否能跑通。", ["docs/scenarios/wizard-of-oz-testing.md", "scripts/wizard_workbench.py"], ["手动选择 ToolCall", "沙盘数据"], ["操作结果", "流程缺口"]),

      node("docs", "项目文档", "README/架构/参考", "governance", "done", 1490, 210, 55, "项目知识入口。把架构、计划、参考、运行、沙盘分开放，防止长期开发后信息混在一起。", ["docs/README.md", "docs/architecture/project-structure.md"], ["实现状态", "设计决策", "测试结论"], ["索引", "长期记忆", "开发指引"]),
      node("tests", "测试体系", "unit/integration", "governance", "done", 1490, 325, 50, "覆盖 ToolCall、Adapter、物料 Resolver、编排器和沙盘脚本的验证。当前新增 Resolver 相关测试 11 条通过。", ["tests/unit", "tests/integration"], ["代码变更", "业务样例"], ["回归结果", "行为约束"]),
      node("github", "GitHub/Git", "版本基线", "governance", "done", 1280, 160, 48, "记录当前项目提交历史和远端同步。近期提交包括物料发布版 v0.3 和物料 Resolver 编排层。", [".git", "docs/project-status.md"], ["代码与文档变更"], ["可回滚基线", "远程仓库"])
    ];

    const edges = [
      edge("employee", "assistant", "flow", "员工把任务交给个人助理"),
      edge("assistant", "intent", "flow", "自然语言进入意图抽取"),
      edge("assistant", "context", "data", "注入员工和岗位上下文"),
      edge("intent", "orchestrator", "flow", "业务意图草稿进入编排器"),
      edge("context", "orchestrator", "data", "公司、项目、仓库、日期上下文"),
      edge("material_release", "material_resolver", "data", "发布版物料表作为检索源"),
      edge("material_resolver", "orchestrator", "data", "物料候选或唯一 SKU"),
      edge("orchestrator", "tool_contracts", "data", "按工具契约填字段"),
      edge("orchestrator", "gateway", "flow", "生成候选 ToolCall"),
      edge("tool_contracts", "gateway", "guard", "访问策略和确认规则"),
      edge("gateway", "adapter", "flow", "通过门禁后执行"),
      edge("tool_schemas", "adapter", "data", "handler 与 schema 对齐"),
      edge("adapter", "erp_api", "flow", "调用 Frappe API"),
      edge("adapter", "bridge", "flow", "复杂业务走 agent_bridge"),
      edge("erp_api", "sandbox", "data", "本地账套承载测试数据"),
      edge("erp_api", "memory", "data", "ToolResult 写入结构化记忆"),
      edge("material_governance", "material_release", "data", "生成发布版物料表"),
      edge("material_release", "material_browser", "data", "生成浏览器数据"),
      edge("material_browser", "material_governance", "doc", "人工检查反馈治理规则"),
      edge("scenario_day", "coverage", "doc", "沙盘暴露缺失 ToolCall"),
      edge("wizard", "scenario_day", "flow", "手动跑业务流程"),
      edge("sandbox", "scenario_day", "data", "沙盘读写本地 ERPNext"),
      edge("coverage", "tool_schemas", "doc", "覆盖矩阵指导工具补齐"),
      edge("tests", "orchestrator", "doc", "单元测试约束编排行为"),
      edge("tests", "material_resolver", "doc", "单元测试约束检索行为"),
      edge("docs", "assistant", "doc", "长期设计记忆"),
      edge("docs", "tool_contracts", "doc", "契约说明和数据字典"),
      edge("github", "docs", "doc", "版本状态写入项目文档"),
      edge("github", "tests", "doc", "提交前回归"),
      edge("gateway", "erp_api", "guard", "ERPNext 后端最终权限裁决")
    ];

    const nodeById = new Map(nodes.map(item => [item.id, item]));
    let selectedNodeId = "orchestrator";
    let selectedLayer = "all";
    let viewBox = { x: 0, y: 0, w: 1800, h: 1080 };
    let dragState = null;

    const svg = document.getElementById("mapSvg");
    const mapWrap = document.getElementById("mapWrap");
    const detailPane = document.getElementById("detailPane");
    const selectedLayerLabel = document.getElementById("selectedLayer");
    const visibleCount = document.getElementById("visibleCount");
    const searchInput = document.getElementById("searchInput");
    const statusFilter = document.getElementById("statusFilter");

    function node(id, label, sub, layer, status, x, y, r, desc, files, inputs, outputs) {
      return { id, label, sub, layer, status, x, y, r, desc, files, inputs, outputs };
    }

    function edge(source, target, type, label) {
      return { source, target, type, label };
    }

    function renderLayerList() {
      const list = document.getElementById("layerList");
      const counts = countBy(nodes, "layer");
      list.innerHTML = "";
      list.appendChild(makeLayerButton("all", "全部模块", `${nodes.length} 个节点`, "显示所有层级。"));
      Object.entries(layers).forEach(([key, layer]) => {
        list.appendChild(makeLayerButton(key, layer.label, `${counts[key] || 0} 个节点`, layer.desc));
      });
    }

    function makeLayerButton(key, title, count, desc) {
      const button = document.createElement("button");
      button.className = "layer-button";
      button.dataset.layer = key;
      const mark = key === "all" ? "" : `<span class="dot" style="background:${layers[key].color}"></span>`;
      button.innerHTML = `
        <div class="layer-title">
          <span>${mark}${title}</span>
          <span>${count}</span>
        </div>
        <div class="layer-desc">${desc}</div>
      `;
      button.addEventListener("click", () => {
        selectedLayer = key;
        update();
      });
      return button;
    }

    function renderMetrics() {
      const list = document.getElementById("metricList");
      const counts = countBy(nodes, "status");
      list.innerHTML = Object.entries(statusLabels).map(([status, label]) => `
        <div class="metric-row">
          <span><span class="dot" style="background:${statusColor(status)}"></span> ${label}</span>
          <strong>${counts[status] || 0}</strong>
        </div>
      `).join("");
    }

    function renderMap() {
      svg.innerHTML = `
        <defs>
          <marker id="arrow-flow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
            <path d="M2 2 L10 6 L2 10 Z" fill="#2563eb"></path>
          </marker>
          <marker id="arrow-data" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
            <path d="M2 2 L10 6 L2 10 Z" fill="#0f766e"></path>
          </marker>
          <marker id="arrow-guard" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
            <path d="M2 2 L10 6 L2 10 Z" fill="#dc2626"></path>
          </marker>
          <marker id="arrow-doc" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
            <path d="M2 2 L10 6 L2 10 Z" fill="#64748b"></path>
          </marker>
        </defs>
        <g id="viewport">
          <g class="zone-labels">
            <text class="zone-label" x="900" y="34">员工入口</text>
            <text class="zone-label" x="900" y="324">Runtime 编排核心</text>
            <text class="zone-label" x="900" y="524">ToolCall 执行通道</text>
            <text class="zone-label" x="1180" y="696">ERPNext 执行层</text>
            <text class="zone-label" x="300" y="625">物料主数据域</text>
            <text class="zone-label" x="665" y="835">业务沙盘验证</text>
          </g>
          <g id="edges"></g>
          <g id="nodes"></g>
        </g>
      `;

      const edgeGroup = svg.querySelector("#edges");
      const nodeGroup = svg.querySelector("#nodes");

      edges.forEach((item, index) => {
        const source = nodeById.get(item.source);
        const target = nodeById.get(item.target);
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("class", `edge ${item.type}`);
        path.setAttribute("data-source", item.source);
        path.setAttribute("data-target", item.target);
        path.setAttribute("data-label", item.label);
        path.setAttribute("marker-end", `url(#arrow-${item.type})`);
        path.setAttribute("d", edgePath(source, target, index));
        edgeGroup.appendChild(path);
      });

      nodes.forEach(item => {
        const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
        group.setAttribute("class", "node");
        group.setAttribute("data-id", item.id);
        group.setAttribute("transform", `translate(${item.x} ${item.y})`);
        group.innerHTML = `
          <circle class="ring" r="${item.r + 8}" stroke="${statusColor(item.status)}"></circle>
          <circle class="main" r="${item.r}" fill="${layers[item.layer].color}"></circle>
          ${labelLines(item.label, item.sub, item.r)}
        `;
        group.addEventListener("click", () => {
          selectedNodeId = item.id;
          update();
        });
        nodeGroup.appendChild(group);
      });
    }

    function edgePath(source, target, index) {
      const dx = target.x - source.x;
      const dy = target.y - source.y;
      const distance = Math.max(1, Math.hypot(dx, dy));
      const sx = source.x + dx / distance * source.r;
      const sy = source.y + dy / distance * source.r;
      const tx = target.x - dx / distance * target.r;
      const ty = target.y - dy / distance * target.r;
      const curve = ((index % 3) - 1) * 28;
      const mx = (sx + tx) / 2 - dy / distance * curve;
      const my = (sy + ty) / 2 + dx / distance * curve;
      return `M ${sx} ${sy} Q ${mx} ${my} ${tx} ${ty}`;
    }

    function labelLines(label, sub, radius) {
      const main = splitLabel(label, radius > 56 ? 6 : 5);
      const startY = main.length > 1 ? -8 : -3;
      const lines = main.map((line, index) => `<text y="${startY + index * 17}" fill="#fff">${escapeHtml(line)}</text>`).join("");
      const subY = startY + main.length * 17 + 3;
      return `${lines}<text class="small" y="${subY}" fill="#e9f0ff">${escapeHtml(sub)}</text>`;
    }

    function splitLabel(label, maxChars) {
      if (label.length <= maxChars) return [label];
      const chunks = [];
      for (let i = 0; i < label.length; i += maxChars) chunks.push(label.slice(i, i + maxChars));
      return chunks.slice(0, 2);
    }

    function update() {
      const query = normalize(searchInput.value);
      const status = statusFilter.value;
      const visible = new Set(
        nodes
          .filter(item => selectedLayer === "all" || item.layer === selectedLayer)
          .filter(item => status === "all" || item.status === status)
          .filter(item => !query || nodeSearchText(item).includes(query))
          .map(item => item.id)
      );

      document.querySelectorAll(".layer-button").forEach(button => {
        button.classList.toggle("active", button.dataset.layer === selectedLayer);
      });

      const selected = nodeById.get(selectedNodeId) || nodes[0];
      const related = relatedNodeIds(selected.id);
      const hasSearchOrFilter = visible.size !== nodes.length;

      document.querySelectorAll(".node").forEach(element => {
        const id = element.dataset.id;
        const isVisible = visible.has(id);
        const isRelated = related.has(id) || id === selected.id;
        element.style.display = isVisible ? "" : "none";
        element.classList.toggle("selected", id === selected.id);
        element.classList.toggle("dim", !hasSearchOrFilter && !isRelated);
      });

      document.querySelectorAll(".edge").forEach(element => {
        const source = element.dataset.source;
        const target = element.dataset.target;
        const isVisible = visible.has(source) && visible.has(target);
        const isRelated = source === selected.id || target === selected.id;
        element.style.display = isVisible ? "" : "none";
        element.classList.toggle("active", isRelated);
        element.classList.toggle("dim", !hasSearchOrFilter && !isRelated);
      });

      visibleCount.textContent = `${visible.size} 个节点`;
      renderDetail(selected);
      selectedLayerLabel.textContent = layers[selected.layer].label;
      selectedLayerLabel.style.background = tint(layers[selected.layer].color);
      selectedLayerLabel.style.color = layers[selected.layer].color;
    }

    function renderDetail(item) {
      const upstream = edges.filter(link => link.target === item.id).map(link => ({
        node: nodeById.get(link.source),
        label: link.label
      }));
      const downstream = edges.filter(link => link.source === item.id).map(link => ({
        node: nodeById.get(link.target),
        label: link.label
      }));

      detailPane.innerHTML = `
        <div class="detail-title">
          <span class="dot" style="background:${layers[item.layer].color}; width:14px; height:14px;"></span>
          <h3>${escapeHtml(item.label)}</h3>
        </div>
        <span class="pill ${item.status}">${statusLabels[item.status]}</span>
        <span class="pill">${escapeHtml(item.sub)}</span>
        <p class="detail-copy">${escapeHtml(item.desc)}</p>
        ${detailSection("主要文件", item.files.map(file => ({ title: file, body: "" })))}
        ${detailSection("输入", item.inputs.map(input => ({ title: input, body: "" })))}
        ${detailSection("输出", item.outputs.map(output => ({ title: output, body: "" })))}
        ${detailSection("上游依赖", upstream.map(input => ({ title: input.node.label, body: input.label })))}
        ${detailSection("下游影响", downstream.map(output => ({ title: output.node.label, body: output.label })))}
        <div class="footer-note">这个页面是只读项目地图，不读取密钥，不调用 ERPNext，不修改任何数据。</div>
      `;
    }

    function detailSection(title, items) {
      if (!items.length) return "";
      return `
        <div class="section">
          <h4>${title}</h4>
          <div class="list">
            ${items.map(item => `<div class="item"><strong>${escapeHtml(item.title)}</strong>${escapeHtml(item.body)}</div>`).join("")}
          </div>
        </div>
      `;
    }

    function relatedNodeIds(id) {
      const related = new Set();
      edges.forEach(item => {
        if (item.source === id) related.add(item.target);
        if (item.target === id) related.add(item.source);
      });
      return related;
    }

    function nodeSearchText(item) {
      return normalize([
        item.label, item.sub, item.desc, layers[item.layer].label, item.status,
        ...item.files, ...item.inputs, ...item.outputs
      ].join(" "));
    }

    function countBy(items, key) {
      return items.reduce((acc, item) => {
        acc[item[key]] = (acc[item[key]] || 0) + 1;
        return acc;
      }, {});
    }

    function statusColor(status) {
      return status === "done" ? "#15803d" : status === "active" ? "#b45309" : "#64748b";
    }

    function tint(color) {
      const map = {
        "#475569": "#eef2f6",
        "#2563eb": "#dbeafe",
        "#0f766e": "#ccfbf1",
        "#7c3aed": "#ede9fe",
        "#ca8a04": "#fef3c7",
        "#dc2626": "#fee2e2",
        "#64748b": "#e2e8f0"
      };
      return map[color] || "#eef2f6";
    }

    function normalize(value) {
      return String(value || "").toLowerCase().replace(/\s+/g, "");
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function setViewBox(next) {
      viewBox = next;
      svg.setAttribute("viewBox", `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
    }

    function zoom(factor) {
      const cx = viewBox.x + viewBox.w / 2;
      const cy = viewBox.y + viewBox.h / 2;
      const nextW = Math.min(2600, Math.max(800, viewBox.w * factor));
      const nextH = Math.min(1560, Math.max(480, viewBox.h * factor));
      setViewBox({ x: cx - nextW / 2, y: cy - nextH / 2, w: nextW, h: nextH });
    }

    function resetView() {
      setViewBox({ x: 0, y: 0, w: 1800, h: 1080 });
    }

    svg.addEventListener("wheel", event => {
      event.preventDefault();
      zoom(event.deltaY > 0 ? 1.08 : 0.92);
    }, { passive: false });

    svg.addEventListener("pointerdown", event => {
      if (event.target.closest(".node")) return;
      dragState = { x: event.clientX, y: event.clientY, viewBox: { ...viewBox } };
      mapWrap.classList.add("dragging");
      svg.setPointerCapture(event.pointerId);
    });

    svg.addEventListener("pointermove", event => {
      if (!dragState) return;
      const rect = svg.getBoundingClientRect();
      const dx = (event.clientX - dragState.x) / rect.width * dragState.viewBox.w;
      const dy = (event.clientY - dragState.y) / rect.height * dragState.viewBox.h;
      setViewBox({
        x: dragState.viewBox.x - dx,
        y: dragState.viewBox.y - dy,
        w: dragState.viewBox.w,
        h: dragState.viewBox.h
      });
    });

    svg.addEventListener("pointerup", event => {
      dragState = null;
      mapWrap.classList.remove("dragging");
      svg.releasePointerCapture(event.pointerId);
    });

    svg.addEventListener("pointercancel", () => {
      dragState = null;
      mapWrap.classList.remove("dragging");
    });

    searchInput.addEventListener("input", update);
    statusFilter.addEventListener("change", update);
    document.getElementById("zoomIn").addEventListener("click", () => zoom(0.9));
    document.getElementById("zoomOut").addEventListener("click", () => zoom(1.1));
    document.getElementById("resetView").addEventListener("click", resetView);

    renderLayerList();
    renderMetrics();
    renderMap();
    resetView();
    update();
  </script>
