[unix_http_server]
file=/tmp/supervisor-compact.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord-compact.pid
childlogdir=/var/log/supervisor

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor-compact.sock

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
directory=/home/frappe/frappe-bench
autostart=true
autorestart=true
startsecs=3
priority=10
stdout_logfile=/var/log/supervisor/nginx.out.log
stderr_logfile=/var/log/supervisor/nginx.err.log
stopwaitsecs=10

[program:backend]
command=/usr/local/bin/start.sh
directory=/home/frappe/frappe-bench
autostart=true
autorestart=true
startsecs=5
priority=20
stdout_logfile=/var/log/supervisor/backend.out.log
stderr_logfile=/var/log/supervisor/backend.err.log
stopwaitsecs=30

[program:websocket]
command=node /home/frappe/frappe-bench/apps/frappe/socketio.js
directory=/home/frappe/frappe-bench
autostart=true
autorestart=true
startsecs=3
priority=30
stdout_logfile=/var/log/supervisor/websocket.out.log
stderr_logfile=/var/log/supervisor/websocket.err.log
stopwaitsecs=10

[program:scheduler]
command=bench schedule
directory=/home/frappe/frappe-bench
autostart=true
autorestart=true
startsecs=3
priority=40
stdout_logfile=/var/log/supervisor/scheduler.out.log
stderr_logfile=/var/log/supervisor/scheduler.err.log
stopwaitsecs=10

[program:queue-short]
command=bench worker --queue short,default
directory=/home/frappe/frappe-bench
autostart=true
autorestart=true
startsecs=3
priority=50
stdout_logfile=/var/log/supervisor/queue-short.out.log
stderr_logfile=/var/log/supervisor/queue-short.err.log
stopwaitsecs=20

[program:queue-long]
command=bench worker --queue long,default,short
directory=/home/frappe/frappe-bench
autostart=true
autorestart=true
startsecs=3
priority=60
stdout_logfile=/var/log/supervisor/queue-long.out.log
stderr_logfile=/var/log/supervisor/queue-long.err.log
stopwaitsecs=20
