<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Agent Runtime 对比实验</title>
    <link rel="stylesheet" href="/workbench-assets/runtime-compare.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/"><span>N</span><strong>Agent Runtime 对比实验</strong></a>
      <nav><a href="/agent-runtime">运行剖面</a><a href="/operation-model">字段模型</a><a href="/">员工工作台</a></nav>
    </header>

    <main>
      <section class="control-band">
        <div>
          <p class="eyebrow">A/B 预览</p>
          <h1>同一句员工请求，两套 Agent 怎么处理</h1>
          <p>左侧是现有 Capability Runtime，右侧是 OpenClaw 渐进式说明书 Runtime。两侧默认只预览，禁止写入 ERPNext。</p>
        </div>
        <form id="compareForm">
          <label>项目<select id="project"></select></label>
          <label>员工<select id="employee"></select></label>
          <label class="request-field">员工请求<textarea id="requestText" rows="3">帮我给合流1.3标申请20包水泥，后天要用</textarea></label>
          <button id="runCompare" type="submit">开始对比</button>
        </form>
      </section>

      <section id="summary" class="summary-band" hidden></section>

      <section class="comparison-grid">
        <article class="runtime-column" data-side="existing">
          <header><div><p class="eyebrow">基线</p><h2>现有 Nexterp Runtime</h2></div><span class="status" id="existingStatus">等待</span></header>
          <div id="existingMetrics" class="metrics"></div>
          <section><h3>最终回复</h3><div id="existingMessage" class="message empty">运行后显示结果</div></section>
          <section><h3>可审计步骤</h3><div id="existingSteps" class="steps empty">尚无步骤</div></section>
          <section><h3>确认与追问</h3><div id="existingDetails" class="details empty">尚无内容</div></section>
        </article>

        <article class="runtime-column" data-side="openclaw">
          <header><div><p class="eyebrow">试验</p><h2>OpenClaw 说明书 Runtime</h2></div><span class="status" id="openclawStatus">等待</span></header>
          <div id="openclawMetrics" class="metrics"></div>
          <section><h3>最终回复</h3><div id="openclawMessage" class="message empty">运行后显示结果</div></section>
          <section><h3>加载节点与元工具</h3><div id="openclawSteps" class="steps empty">尚无步骤</div></section>
          <section><h3>确认与追问</h3><div id="openclawDetails" class="details empty">尚无内容</div></section>
        </article>
      </section>
    </main>
    <script src="/workbench-assets/runtime-compare.js" defer></script>
  </body>
</html>
