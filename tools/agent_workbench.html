<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>员工 Agent 测试台</title>
    <style>
      :root {
        --bg: #f4f6f8;
        --surface: #fff;
        --surface-2: #eef2f5;
        --line: #d9e0e6;
        --text: #18212b;
        --muted: #65717e;
        --accent: #087f5b;
        --accent-soft: #e7f5ef;
        --warn: #9a6700;
        --warn-soft: #fff7d6;
        --danger: #b42318;
        --danger-soft: #fff0ee;
        font-family: Inter, ui-sans-serif, system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); }
      button, textarea, select { font: inherit; }
      button { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--text); cursor: pointer; }
      button:hover { border-color: #9aa6b2; }
      button:disabled { cursor: not-allowed; opacity: .5; }
      .primary { border-color: var(--accent); background: var(--accent); color: white; }
      .danger { border-color: #efb4ae; background: var(--danger-soft); color: var(--danger); }
      header { height: 58px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; border-bottom: 1px solid var(--line); background: var(--surface); }
      h1 { margin: 0; font-size: 18px; letter-spacing: 0; }
      .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #9aa6b2; }
      .dot.ok { background: var(--accent); }
      main { height: calc(100vh - 58px); display: grid; grid-template-columns: 270px minmax(420px, 1fr) minmax(390px, 42%); }
      aside, section { min-width: 0; }
      .employees { border-right: 1px solid var(--line); background: var(--surface); overflow: auto; }
      .project-picker { padding: 0 12px 12px; }
      .project-picker select { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
      .project-meta { margin-top: 7px; color: var(--muted); font-size: 11px; line-height: 1.45; }
      .panel-title { padding: 14px 16px 10px; color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; }
      .employee { width: 100%; padding: 12px 16px; border: 0; border-radius: 0; border-top: 1px solid #edf0f2; text-align: left; background: transparent; }
      .employee.active { background: var(--accent-soft); box-shadow: inset 3px 0 var(--accent); }
      .employee strong { display: block; font-size: 14px; }
      .employee span { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }
      .chat { display: grid; grid-template-rows: 1fr auto; min-height: 0; }
      .messages { overflow: auto; padding: 20px; }
      .empty { max-width: 640px; margin: 70px auto 0; text-align: center; color: var(--muted); }
      .empty h2 { color: var(--text); font-size: 22px; margin: 0 0 8px; }
      .examples { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 24px; }
      .examples button { padding: 8px 10px; font-size: 12px; }
      .message { max-width: 82%; margin-bottom: 14px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 8px; white-space: pre-wrap; line-height: 1.55; }
      .message.user { margin-left: auto; border-color: #b8ddd0; background: var(--accent-soft); }
      .message.agent { background: var(--surface); }
      .message.error { border-color: #efb4ae; background: var(--danger-soft); }
      .composer { padding: 14px; border-top: 1px solid var(--line); background: var(--surface); }
      textarea { width: 100%; min-height: 82px; max-height: 180px; resize: vertical; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; color: var(--text); outline: none; }
      textarea:focus { border-color: var(--accent); }
      .actions { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; }
      .actions small { color: var(--muted); }
      .actions div { display: flex; gap: 8px; }
      .actions button { min-height: 36px; padding: 0 14px; }
      .details { border-left: 1px solid var(--line); background: var(--surface); overflow: auto; }
      .tabs { position: sticky; top: 0; z-index: 2; display: flex; border-bottom: 1px solid var(--line); background: var(--surface); }
      .tab { padding: 12px 14px; border: 0; border-radius: 0; color: var(--muted); }
      .tab.active { color: var(--accent); box-shadow: inset 0 -2px var(--accent); }
      .tab.documents-tab { margin-left: auto; font-weight: 700; }
      .detail-body { padding: 14px; }
      .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
      .metric { padding: 10px; border: 1px solid var(--line); border-radius: 6px; }
      .metric span { display: block; color: var(--muted); font-size: 11px; }
      .metric strong { display: block; margin-top: 5px; font-size: 13px; overflow-wrap: anywhere; }
      pre { margin: 0; padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: #f7f9fa; overflow: auto; font: 12px/1.55 Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
      .links { margin: 0 0 14px; padding: 0; list-style: none; }
      .links li { margin-bottom: 7px; }
      .links a { color: var(--accent); text-decoration: none; font-weight: 600; }
      .module { margin-bottom: 18px; }
      .module h3 { margin: 0 0 8px; font-size: 14px; }
      .doctype-group { margin-bottom: 10px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
      .doctype-head { display: flex; justify-content: space-between; padding: 8px 10px; background: var(--surface-2); font-size: 12px; font-weight: 700; }
      .doc-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 8px 10px; border-top: 1px solid #edf0f2; font-size: 12px; }
      .doc-row a { color: var(--accent); text-decoration: none; font-weight: 600; overflow-wrap: anywhere; }
      .doc-row span, .no-docs { color: var(--muted); }
      .no-docs { padding: 9px 10px; font-size: 12px; border-top: 1px solid #edf0f2; }
      .confirm-bar { display: none; padding: 12px 14px; border-top: 1px solid #efd998; background: var(--warn-soft); }
      .confirm-bar.visible { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
      .confirm-bar span { color: #704f00; font-size: 13px; }
      .confirm-bar button { padding: 8px 12px; }
      @media (max-width: 1050px) {
        main { grid-template-columns: 190px 1fr; }
        .details { position: fixed; z-index: 20; inset: 58px 0 0 28%; transform: translateX(100%); transition: transform .2s ease; }
        .details.open { transform: translateX(0); }
      }
      @media (max-width: 700px) {
        main { grid-template-columns: 1fr; }
        .employees { display: none; }
        .details { inset-left: 0; }
        .message { max-width: 94%; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>员工 Agent 测试台</h1>
      <div class="status"><span id="healthDot" class="dot"></span><span id="healthText">正在连接</span></div>
    </header>
    <main>
      <aside class="employees">
        <div class="panel-title">项目</div>
        <div class="project-picker"><select id="projectSelect"></select><div id="projectMeta" class="project-meta"></div></div>
        <div class="panel-title">项目员工与岗位</div>
        <div id="employeeList"></div>
      </aside>
      <section class="chat">
        <div id="messages" class="messages">
          <div id="empty" class="empty">
            <h2>用员工身份测试真实业务</h2>
            <p>先预览 Agent 的理解和 ToolCall，确认后才会写入 ERPNext。</p>
            <div class="examples">
              <button data-example="合流1.3标明天需要20个6.8级螺栓M12*40，送到合流1.3标仓库，创建材料申请草稿">创建材料申请</button>
              <button data-example="合流1.3标仓库还有多少6.8级螺栓M12*40">查询库存</button>
              <button data-example="今天公司有哪些异常需要我关注">管理摘要</button>
            </div>
          </div>
        </div>
        <div>
          <div id="confirmBar" class="confirm-bar">
            <span>该操作将使用所选员工身份写入 ERPNext。</span>
            <div><button id="cancelConfirm">取消</button><button id="executeBtn" class="danger">确认执行</button></div>
          </div>
          <div class="composer">
            <textarea id="input" placeholder="例如：合流1.3标明天需要20个6.8级螺栓M12*40，送到合流1.3标仓库"></textarea>
            <div class="actions">
              <small id="actorLabel">请选择员工</small>
              <div><button id="clearBtn">清空</button><button id="previewBtn" class="primary">预览 Agent 操作</button></div>
            </div>
          </div>
        </div>
      </section>
      <aside id="details" class="details">
        <div class="tabs">
          <button class="tab active" data-tab="overview">概览</button>
          <button class="tab" data-tab="steps">Agent步骤</button>
          <button class="tab" data-tab="toolcall">ToolCall</button>
          <button class="tab" data-tab="result">ToolResult</button>
          <button class="tab" data-tab="raw">完整 JSON</button>
          <button class="tab documents-tab" data-tab="documents">业务单据</button>
        </div>
        <div id="detailBody" class="detail-body"><p class="empty">执行一次预览后，这里会显示结构化过程。</p></div>
      </aside>
    </main>
    <script>
      const state = { projects: [], project: null, employees: [], user: null, preview: null, documents: null, lastText: "", executeId: null, tab: "overview" };
      const $ = (id) => document.getElementById(id);
      const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
      const pretty = (value) => JSON.stringify(value ?? null, null, 2);

      async function api(path, options = {}) {
        const response = await fetch(path, { headers: {"Content-Type":"application/json"}, ...options });
        const data = await response.json();
        if (!response.ok || data.ok === false && !data.result) throw new Error(data.error || `HTTP ${response.status}`);
        return data;
      }

      async function boot() {
        try {
          const [health, catalog] = await Promise.all([api("/api/health"), api("/api/catalog")]);
          $("healthDot").classList.add("ok"); $("healthText").textContent = `Agent 服务已连接 · ${health.profile}`;
          state.projects = catalog.projects;
          $("projectSelect").innerHTML = state.projects.map(p => `<option value="${esc(p.project_code)}">${esc(p.project_short_name)} · ${esc(p.operating_status)}</option>`).join("");
          $("projectSelect").onchange = () => selectProject(state.projects.find(p => p.project_code === $("projectSelect").value));
          selectProject(state.projects.find(p => p.project_code === "PRJ-HL-13") || state.projects[0]);
        } catch (error) { $("healthText").textContent = error.message; }
      }

      function selectProject(project) {
        state.project = project; state.employees = project.employees || []; state.documents = null;
        $("projectSelect").value = project.project_code;
        $("projectMeta").textContent = `${project.project_name}\n默认仓库：${project.warehouse_code || "未配置"}`;
        renderEmployees();
        selectEmployee(state.employees.find(e => e.employee_name === "毛晓泉") || state.employees[0] || null);
      }

      function renderEmployees() {
        $("employeeList").innerHTML = state.employees.length ? state.employees.map(e => `<button class="employee" data-user="${esc(e.user_email)}"><strong>${esc(e.employee_name)}</strong><span>${esc(e.project_position || e.position)}</span><span>${esc(e.user_email)}</span></button>`).join("") : `<div class="no-docs">该项目尚未配置项目员工，仅保留基础项目资料。</div>`;
        document.querySelectorAll(".employee").forEach(btn => btn.onclick = () => selectEmployee(state.employees.find(e => e.user_email === btn.dataset.user)));
      }

      function selectEmployee(employee) {
        state.user = employee;
        document.querySelectorAll(".employee").forEach(btn => btn.classList.toggle("active", employee && btn.dataset.user === employee.user_email));
        $("actorLabel").textContent = employee ? `${state.project.project_short_name} · ${employee.employee_name} · ${employee.project_position || employee.position}` : "该项目暂未配置员工";
        loadDocuments();
      }

      async function loadDocuments() {
        if (!state.user || !state.project) { state.documents = null; renderDetails(); return; }
        state.documents = {loading:true}; if (state.tab === "documents") renderDetails();
        try {
          state.documents = await api(`/api/documents?user=${encodeURIComponent(state.user.user_email)}&project=${encodeURIComponent(state.project.project_code)}`);
        } catch (error) { state.documents = {error:error.message}; }
        if (state.tab === "documents") renderDetails();
      }

      function addMessage(kind, text, links = []) {
        $("empty")?.remove();
        const node = document.createElement("div"); node.className = `message ${kind}`;
        node.innerHTML = `<div>${esc(text)}</div>${links.length ? `<ul class="links">${links.map(l => `<li><a href="${esc(l.url)}" target="_blank">打开 ${esc(l.doctype)} · ${esc(l.name)}</a></li>`).join("")}</ul>` : ""}`;
        $("messages").appendChild(node); $("messages").scrollTop = $("messages").scrollHeight;
      }

      async function run(execute) {
        const text = execute ? state.lastText : $("input").value.trim();
        if (!state.user || !text) return;
        setBusy(true); if (!execute) { state.lastText = text; state.executeId = crypto.randomUUID(); addMessage("user", text); }
        try {
          const data = await api("/api/agent", {method:"POST", body: JSON.stringify({user:state.user.user_email, project_code:state.project?.project_code, warehouse:state.project?.warehouse_code, text, execute, request_id:execute ? state.executeId : null})});
          state.preview = data.result; renderDetails();
          addMessage(data.result.status === "failed" ? "error" : "agent", data.result.message, data.result.document_links || []);
          const canExecute = !execute && ["needs_confirmation"].includes(data.result.status) && (data.result.pending_tool_call || data.result.tool_call);
          $("confirmBar").classList.toggle("visible", canExecute);
          if (execute) $("confirmBar").classList.remove("visible");
        } catch (error) { addMessage("error", error.message); }
        finally { setBusy(false); }
      }

      function setBusy(busy) { $("previewBtn").disabled = busy; $("executeBtn").disabled = busy; $("previewBtn").textContent = busy ? "处理中..." : "预览 Agent 操作"; }

      function renderDetails() {
        const r = state.preview;
        document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === state.tab));
        if (state.tab === "documents") {
          if (!state.documents || state.documents.loading) { $("detailBody").innerHTML = `<p class="empty">正在读取当前员工可见单据...</p>`; return; }
          if (state.documents.error) { $("detailBody").innerHTML = `<p class="message error">${esc(state.documents.error)}</p>`; return; }
          $("detailBody").innerHTML = `<div class="summary"><div class="metric"><span>项目</span><strong>${esc(state.project?.project_short_name)}</strong></div><div class="metric"><span>员工</span><strong>${esc(state.user?.employee_name)}</strong></div><div class="metric"><span>数据范围</span><strong>ERPNext 权限内</strong></div></div>${(state.documents.modules||[]).map(m => `<div class="module"><h3>${esc(m.label)}</h3>${m.groups.map(g => `<div class="doctype-group"><div class="doctype-head"><span>${esc(g.label)}</span><span>${g.documents.length}</span></div>${g.error ? `<div class="no-docs">${esc(g.error)}</div>` : g.documents.length ? g.documents.map(d => `<div class="doc-row"><a target="_blank" href="${esc(d.url)}">${esc(d.name)}</a><span>${esc(d.modified || "")}</span></div>`).join("") : `<div class="no-docs">当前项目暂无可见单据</div>`}</div>`).join("")}</div>`).join("")}`;
        } else if (!r) {
          $("detailBody").innerHTML = `<p class="empty">执行一次预览后，这里会显示结构化过程。</p>`;
        } else if (state.tab === "overview") {
          const questions = (r.questions || []).map(q => `<li>${esc(q)}</li>`).join("");
          $("detailBody").innerHTML = `<div class="summary"><div class="metric"><span>状态</span><strong>${esc(r.status)}</strong></div><div class="metric"><span>Agent步骤</span><strong>${esc((r.steps||[]).length)}</strong></div><div class="metric"><span>员工</span><strong>${esc(state.user?.employee_name)}</strong></div></div>${(r.document_links||[]).length ? `<ul class="links">${r.document_links.map(l=>`<li><a target="_blank" href="${esc(l.url)}">${esc(l.name)}</a></li>`).join("")}</ul>`:""}${questions ? `<h3>需要补充</h3><ul>${questions}</ul>`:""}${(r.candidates||[]).length ? `<h3>候选</h3><pre>${esc(pretty(r.candidates))}</pre>`:""}`;
        } else if (state.tab === "steps") $("detailBody").innerHTML = (r.steps||[]).length ? (r.steps||[]).map((s,i)=>`<div class="doctype-group"><div class="doctype-head"><span>${i+1}. ${esc(s.label)}</span><span>${esc(s.action)}</span></div><pre>${esc(pretty({payload:s.payload,result:s.result}))}</pre></div>`).join("") : `<p class="empty">暂无Agent步骤。</p>`;
        else if (state.tab === "toolcall") $("detailBody").innerHTML = `<pre>${esc(pretty(r.tool_calls?.length ? r.tool_calls : (r.pending_tool_call || r.tool_call)))}</pre>`;
        else if (state.tab === "result") $("detailBody").innerHTML = `<pre>${esc(pretty(r.tool_results?.length ? r.tool_results : r.tool_result))}</pre>`;
        else $("detailBody").innerHTML = `<pre>${esc(pretty(r))}</pre>`;
      }

      $("previewBtn").onclick = () => run(false); $("executeBtn").onclick = () => run(true);
      $("cancelConfirm").onclick = () => $("confirmBar").classList.remove("visible");
      $("clearBtn").onclick = () => { $("input").value = ""; $("messages").innerHTML = ""; state.preview = null; $("detailBody").innerHTML = ""; $("confirmBar").classList.remove("visible"); };
      document.querySelectorAll("[data-example]").forEach(btn => btn.onclick = () => { $("input").value = btn.dataset.example; $("input").focus(); });
      document.querySelectorAll(".tab").forEach(tab => tab.onclick = () => { state.tab = tab.dataset.tab; renderDetails(); if (state.tab === "documents" && !state.documents) loadDocuments(); });
      $("input").addEventListener("keydown", e => { if (e.ctrlKey && e.key === "Enter") run(false); });
      boot();
    </script>
  </body>
</html>
