version: 1
module: stock
tools:
  erpnext.stock.get_balance:
    purpose: "L0：查询库存余额、预计数量和估值快照。"
    expose: agent_visible
    allowed_roles: ["仓管", "仓库主管", "采购", "项目经理", "班组长", "管理层"]
    confirm: none
    backend_mapping:
      doctypes: ["Bin", "Item", "Warehouse"]
      notes: "主要读取 Bin，必要时关联 Item 与 Warehouse。"
    audit_fields: ["item_code", "item_query", "warehouse", "item_group", "limit"]
    repair: ["resolve_entity", "ask_clarification", "present_candidates", "inject_context", "permission_denied"]
    business_contract:
      - "如果 item_code 缺失且 item_query 缺失，必须追问用户要查哪个物料。"
      - "如果 item_query 命中多个物料，必须展示候选，不允许强行选择。"
      - "warehouse 必须解析成 ERPNext Warehouse.name 全称；用户简称只能作为 resolver 输入。"
      - "用户查询某物料所有仓库库存时，warehouse 可以为空。"
    parameters:
      item_code:
        required: conditional
        source: "Item Resolver"
        resolver: item
        constraints:
          - "外键：必须是已存在的 ERPNext Item.item_code。"
          - "禁止模型凭空编物料编码。"
        repair: ["resolve_entity", "present_candidates", "ask_clarification"]
      item_query:
        required: conditional
        source: "用户原话"
        resolver: item
        constraints:
          - "仅作为检索输入，不能直接当成 item_code 使用。"
        repair: ["resolve_entity", "present_candidates"]
      warehouse:
        required: conditional
        source: "Warehouse Resolver / 员工默认仓库"
        resolver: warehouse
        constraints:
          - "必须使用 ERPNext Warehouse.name 全称。"
          - "禁止把中心仓、项目仓等简称直接写入 ToolCall。"
        repair: ["resolve_entity", "ask_clarification", "inject_context"]
      specs:
        source: "Slot Extractor"
        constraints:
          - "只用于辅助物料检索，不作为 ERPNext 主键。"
      item_group:
        source: "Item Group Resolver"
        resolver: item_group
        constraints:
          - "用于缩小候选范围。"
      limit:
        source: "Runtime 默认值"
        constraints:
          - "默认由 Runtime 控制，避免一次返回过多库存行。"

  erpnext.stock.get_item_locations:
    purpose: "L0：查询指定物料在哪些仓库/Bin 有库存。"
    expose: agent_visible
    allowed_roles: ["仓管", "仓库主管", "采购", "项目经理", "班组长", "管理层"]
    confirm: none
    backend_mapping:
      doctypes: ["Bin", "Item", "Warehouse"]
    audit_fields: ["item_code", "item_query", "selected_item_code", "warehouse", "include_zero", "limit"]
    repair: ["resolve_entity", "ask_clarification", "present_candidates", "inject_context", "permission_denied"]
    business_contract:
      - "必须解析到唯一 Item 后才能查询库位；候选不唯一时必须展示候选。"
      - "selection_confirmed 只能由人工选择或上游策略注入，模型不能自行置 true。"
      - "include_zero=true 会暴露零库存库位，默认应保持 false，除非用户明确要求。"
    parameters:
      item_code:
        required: conditional
        source: "Item Resolver"
        resolver: item
        constraints:
          - "必须是已存在且未禁用的 ERPNext Item.item_code。"
        repair: ["resolve_entity", "present_candidates", "ask_clarification"]
      item_query:
        required: conditional
        source: "用户原话"
        resolver: item
        constraints:
          - "仅作为解析输入，不直接写入 ERPNext 外键。"
        repair: ["resolve_entity", "present_candidates"]
      selected_item_code:
        required: conditional
        source: "Item Resolver 候选确认"
        resolver: item
        constraints:
          - "必须来自 erpnext.stock.resolve_item 返回的候选。"
        repair: ["resolve_entity", "present_candidates"]
      selection_confirmed:
        source: "用户确认 / Runtime Policy"
        constraints:
          - "只有已确认候选时才能为 true。"
        repair: ["ask_clarification", "validate_before_execute"]
      item_group:
        source: "Item Group Resolver"
        resolver: item_group
        constraints:
          - "用于辅助物料解析。"
      limit:
        source: "Runtime 默认值"
        constraints:
          - "限制返回库位数量。"

  erpnext.stock.get_ledger_entries:
    purpose: "L0：查询库存流水，用于库存移动审计。"
    expose: agent_visible
    allowed_roles: ["仓管", "仓库主管", "采购", "项目经理", "班组长", "管理层"]
    confirm: none
    backend_mapping:
      doctypes: ["Stock Ledger Entry", "Item", "Warehouse"]
    audit_fields: ["item_code", "warehouse", "voucher_type", "voucher_no", "limit"]
    repair: ["resolve_entity", "ask_clarification", "inject_context", "erpnext_validation_error", "permission_denied"]
    business_contract:
      - "只读查询，不允许由该工具创建、取消或调整库存流水。"
      - "按凭证查询时，voucher_type 与 voucher_no 应同时提供。"
      - "warehouse 如由用户简称给出，必须先解析为 Warehouse.name。"
    parameters:
      item_code:
        source: "Item Resolver"
        resolver: item
        constraints:
          - "必须是 ERPNext Item.item_code。"
        repair: ["resolve_entity", "present_candidates"]
      warehouse:
        source: "Warehouse Resolver"
        resolver: warehouse
        constraints:
          - "必须是 ERPNext Warehouse.name。"
        repair: ["resolve_entity", "ask_clarification"]
      voucher_type:
        source: "用户指定 / Runtime Context"
        constraints:
          - "应使用 ERPNext 凭证类型原名。"
      voucher_no:
        source: "用户指定 / Runtime Context"
        constraints:
          - "必须是已存在业务凭证编号，不能凭空编造。"
      limit:
        source: "Runtime 默认值"
        constraints:
          - "默认限制返回数量，避免拉取过多流水。"

  erpnext.stock.get_stock_settings:
    purpose: "L0：读取库存设置单例，用于判断批次、序列号、预留和估值行为。"
    expose: agent_visible
    allowed_roles: ["仓管", "仓库主管", "管理层"]
    confirm: none
    backend_mapping:
      doctypes: ["Stock Settings"]
    audit_fields: []
    repair: ["permission_denied", "erpnext_validation_error"]
    business_contract:
      - "只允许读取设置，不允许修改库存控制规则。"
      - "输出只能作为后续工具的校验上下文，不应直接覆盖用户确认。"

  erpnext.stock.resolve_item:
    purpose: "L1：解析库存物料候选，不修改 ERPNext。"
    expose: agent_visible
    allowed_roles: ["仓管", "仓库主管", "采购", "项目经理", "班组长", "管理层"]
    confirm: none
    backend_mapping:
      doctypes: ["Item", "Item Group"]
      notes: "可选使用 PostgreSQL material catalog 召回，再以 ERPNext Item 为最终候选。"
    audit_fields: ["query", "specs", "item_group", "enabled_only", "limit"]
    repair: ["resolve_entity", "ask_clarification", "present_candidates", "inject_context", "permission_denied", "erpnext_validation_error"]
    business_contract:
      - "返回候选用于后续 ToolCall，不代表已经获得库存动作授权。"
      - "只有 ERPNext 候选唯一且可用时，才允许自动带入 selected_item_code。"
      - "catalog_database_url 只能来自运行时安全上下文，不应从员工自然语言中采纳。"
    parameters:
      query:
        required: yes
        source: "用户原话"
        resolver: item
        constraints:
          - "必须是物料名称、编码、规格或别名检索词。"
        repair: ["ask_clarification", "resolve_entity", "present_candidates"]
      specs:
        source: "Slot Extractor"
        constraints:
          - "只用于辅助召回和消歧。"
      item_group:
        source: "Item Group Resolver"
        resolver: item_group
        constraints:
          - "必须解析到 ERPNext Item Group.name 后用于缩小候选。"
        repair: ["resolve_entity", "present_candidates"]
      enabled_only:
        source: "Runtime 默认值"
        constraints:
          - "默认 true，避免后续库存动作使用禁用物料。"
      catalog_database_url:
        source: "Runtime Secret"
        constraints:
          - "禁止由模型或用户文本直接提供连接串。"
        repair: ["inject_context", "permission_denied"]

  erpnext.stock.create_entry_draft:
    purpose: "L3：创建 Stock Entry 草稿，用于收料、发料、转移、制造或重包；不提交。"
    expose: agent_visible
    allowed_roles: ["仓管", "仓库主管"]
    confirm: user_confirm
    backend_mapping:
      doctypes: ["Stock Entry", "Stock Entry Detail", "Item", "Warehouse", "Batch", "Serial No", "UOM"]
    audit_fields: ["stock_entry_type", "purpose", "company", "posting_date", "items", "remarks"]
    repair: ["resolve_entity", "ask_clarification", "present_candidates", "inject_context", "validate_before_execute", "erpnext_validation_error", "permission_denied"]
    business_contract:
      - "采购角色不能创建库存移动草稿。"
      - "创建前必须确认 stock_entry_type/purpose、公司、日期、每行物料、仓库和数量。"
      - "items 至少 1 行；每行 item_code 必须来自 Item Resolver 或已确认 selected_item_code。"
      - "数量必须为正数；涉及批次、序列号、UOM、源/目标仓库时必须先解析主数据。"
      - "默认口径：按 ERPNext Stock Entry purpose 校验仓库方向：Material Issue 需要 s_warehouse，Material Receipt 需要 t_warehouse，Material Transfer 两者都需要；自定义类型按 Stock Entry Type 元数据校验。"
    parameters:
      stock_entry_type:
        source: "用户选择 / Runtime Policy"
        constraints:
          - "应匹配 ERPNext Stock Entry Type。"
          - "默认口径：允许使用已存在且启用的自定义 Stock Entry Type，但必须由 resolver 精确命中并通过权限校验。"
        repair: ["ask_clarification", "validate_before_execute"]
      purpose:
        source: "用户选择 / Runtime Policy"
        constraints:
          - "应与 stock_entry_type 和业务场景一致。"
        repair: ["ask_clarification", "validate_before_execute"]
      company:
        required: conditional
        source: "Runtime Context"
        resolver: company
        constraints:
          - "必须是 ERPNext Company.name 全称。"
        repair: ["inject_context", "resolve_entity"]
      posting_date:
        required: conditional
        source: "Date Resolver"
        resolver: date
        constraints:
          - "必须是 ISO 日期。"
        repair: ["inject_context", "ask_clarification"]
      remarks:
        source: "用户说明"
        constraints:
          - "库存移动原因、业务单据来源或现场说明应进入 remarks。"
      items:
        required: yes
        source: "Item/Warehouse/Batch/Serial/UOM Resolver + Slot Extractor"
        constraints:
          - "数组至少 1 行。"
          - "每行 qty 必须大于 0。"
          - "每行 item_code、s_warehouse、t_warehouse、batch_no、serial_no、uom/stock_uom 必须分别经 item、warehouse、batch、serial_no、uom resolver。"
          - "模型不得凭空编造批次号、序列号或仓库名。"
        repair: ["resolve_entity", "present_candidates", "ask_clarification", "validate_before_execute"]

  erpnext.stock.create_reconciliation_draft:
    purpose: "L3：创建库存盘点/调整草稿，提交后可能改变账面库存和估值。"
    expose: agent_visible
    allowed_roles: ["仓管", "仓库主管"]
    confirm: supervisor_confirm
    backend_mapping:
      doctypes: ["Stock Reconciliation", "Stock Reconciliation Item", "Item", "Warehouse", "Batch", "Serial No"]
    audit_fields: ["company", "posting_date", "purpose", "items", "remarks"]
    repair: ["resolve_entity", "ask_clarification", "present_candidates", "inject_context", "validate_before_execute", "erpnext_validation_error", "permission_denied"]
    business_contract:
      - "采购员、项目经理、班组长不能直接使用。"
      - "创建草稿前必须记录盘点依据或调整原因。"
      - "差异数量或估值异常过大时必须升级主管确认。"
      - "items 每行必须包含真实 item_code、warehouse 和盘点数量；涉及批次/序列号时必须解析主数据。"
      - "制度配置项：valuation_rate 调整默认需要库存主管确认；单行估值差异超过 1000 或 10% 时升级财务确认，阈值可由站点配置覆盖。"
    parameters:
      company:
        required: conditional
        source: "Runtime Context"
        resolver: company
        constraints:
          - "必须是 ERPNext Company.name 全称。"
        repair: ["inject_context", "resolve_entity"]
      posting_date:
        required: conditional
        source: "Date Resolver"
        resolver: date
        constraints:
          - "必须是 ISO 日期。"
        repair: ["inject_context", "ask_clarification"]
      purpose:
        source: "用户选择 / Runtime Policy"
        constraints:
          - "应明确是盘点、数量调整还是估值调整。"
        repair: ["ask_clarification", "validate_before_execute"]
      remarks:
        required: conditional
        source: "盘点说明"
        constraints:
          - "必须记录盘点依据或调整原因。"
        repair: ["ask_clarification"]
      items:
        required: yes
        source: "库存盘点表单编排"
        constraints:
          - "不允许模型自由拼任意字段。"
          - "items 每行必须包含真实 item_code、warehouse、盘点数量和差异原因。"
          - "每行 item_code、warehouse、batch_no、serial_no 必须分别经 item、warehouse、batch、serial_no resolver。"
        repair: ["resolve_entity", "present_candidates", "ask_clarification", "validate_before_execute"]

  erpnext.stock.search_batches:
    purpose: "L0：按物料或批次关键字查询 Batch 追溯记录。"
    expose: agent_visible
    allowed_roles: ["仓管", "仓库主管", "采购", "项目经理", "班组长", "管理层"]
    confirm: none
    backend_mapping:
      doctypes: ["Batch", "Item"]
    audit_fields: ["item_code", "item_query", "query", "limit"]
    repair: ["resolve_entity", "ask_clarification", "present_candidates", "permission_denied", "erpnext_validation_error"]
    business_contract:
      - "只读查询，不允许通过该工具更新批次状态或有效期。"
      - "按物料查批次时，item_code 必须解析到唯一 Item。"
      - "query 只能作为批次检索词，不能直接当成确认的 batch_no。"
    parameters:
      item_code:
        source: "Item Resolver"
        resolver: item
        constraints:
          - "必须是 ERPNext Item.item_code。"
        repair: ["resolve_entity", "present_candidates"]
      item_query:
        source: "用户原话"
        resolver: item
        constraints:
          - "仅用于解析 item_code。"
        repair: ["resolve_entity", "present_candidates"]
      query:
        source: "用户原话"
        resolver: batch
        constraints:
          - "批次关键词需经过候选展示后才能作为 batch_no 使用。"
        repair: ["resolve_entity", "present_candidates"]

  erpnext.stock.list_batch_balances:
    purpose: "L0：汇总物料批次在仓库中的可用数量和库存流水。"
    expose: agent_visible
    allowed_roles: ["仓管", "仓库主管", "采购", "项目经理", "班组长", "管理层"]
    confirm: none
    backend_mapping:
      doctypes: ["Batch", "Stock Ledger Entry", "Item", "Warehouse"]
    audit_fields: ["item_code", "item_query", "selected_item_code", "batch_no", "warehouse", "as_of_date", "include_expired", "include_zero"]
    repair: ["resolve_entity", "ask_clarification", "present_candidates", "inject_context", "permission_denied", "erpnext_validation_error"]
    business_contract:
      - "只读查询，不移动库存，不创建保留或拣货。"
      - "必须先解析 Item；批次不明确时展示候选。"
      - "include_expired=true 只用于审计/追溯，不应默认用于发料推荐。"
      - "as_of_date 必须按 ISO 日期解析。"
    parameters:
      item_code:
        required: conditional
        source: "Item Resolver"
        resolver: item
        constraints:
          - "必须是 ERPNext Item.item_code。"
        repair: ["resolve_entity", "present_candidates", "ask_clarification"]
      item_query:
        required: conditional
        source: "用户原话"
        resolver: item
        constraints:
          - "仅用于解析 item_code。"
        repair: ["resolve_entity", "present_candidates"]
      selected_item_code:
        required: conditional
        source: "Item Resolver 候选确认"
        resolver: item
        constraints:
          - "必须来自已确认 Item 候选。"
        repair: ["resolve_entity", "present_candidates"]
      batch_no:
        source: "Batch Resolver"
        resolver: batch
        constraints:
          - "必须是 ERPNext Batch.name 或 batch_id。"
        repair: ["resolve_entity", "present_candidates"]
      query:
        source: "用户原话"
        resolver: batch
        constraints:
          - "作为批次候选检索词使用。"
        repair: ["resolve_entity", "present_candidates"]
      warehouse:
        source: "Warehouse Resolver"
        resolver: warehouse
        constraints:
          - "必须是 ERPNext Warehouse.name。"
        repair: ["resolve_entity", "ask_clarification"]
      as_of_date:
        source: "Date Resolver"
        resolver: date
        constraints:
          - "必须是 ISO 日期。"
        repair: ["ask_clarification"]

  erpnext.stock.search_serial_numbers:
    purpose: "L0：按物料、仓库、状态或序列号关键字查询 Serial No。"
    expose: agent_visible
    allowed_roles: ["仓管", "仓库主管", "采购", "项目经理", "班组长", "管理层"]
    confirm: none
    backend_mapping:
      doctypes: ["Serial No", "Item", "Warehouse"]
    audit_fields: ["item_code", "item_query", "warehouse", "status", "query", "limit"]
    repair: ["resolve_entity", "ask_clarification", "present_candidates", "permission_denied", "erpnext_validation_error"]
    business_contract:
      - "只读查询，不允许更新序列号状态、仓库或关联单据。"
      - "按物料或仓库过滤时必须先解析外键。"
      - "query 只能作为序列号检索词，不代表已确认 serial_no。"
    parameters:
      item_code:
        source: "Item Resolver"
        resolver: item
        constraints:
          - "必须是 ERPNext Item.item_code。"
        repair: ["resolve_entity", "present_candidates"]
      item_query:
        source: "用户原话"
        resolver: item
        constraints:
          - "仅用于解析 item_code。"
        repair: ["resolve_entity", "present_candidates"]
      warehouse:
        source: "Warehouse Resolver"
        resolver: warehouse
        constraints:
          - "必须是 ERPNext Warehouse.name。"
        repair: ["resolve_entity", "ask_clarification"]
      query:
        source: "用户原话"
        resolver: serial_no
        constraints:
          - "用于检索 Serial No 候选。"
        repair: ["resolve_entity", "present_candidates"]

  erpnext.stock.create_batch:
    purpose: "L3：为已有物料创建 Batch 追溯主数据；不移动库存。"
    expose: agent_visible
    allowed_roles: ["仓管", "仓库主管"]
    confirm: user_confirm
    backend_mapping:
      doctypes: ["Batch", "Item"]
    audit_fields: ["data"]
    repair: ["resolve_entity", "ask_clarification", "present_candidates", "validate_before_execute", "erpnext_validation_error", "permission_denied"]
    business_contract:
      - "创建前必须确认关联 Item。"
      - "data.item 或 data.item_code 必须经 item resolver；不能直接采纳未确认物料名称。"
      - "默认口径：批号优先使用 ERPNext naming series/自动批号；有效期仅对启用保质期或批次有效期的 Item 必填，禁用批次必须给出原因。"
    parameters:
      data:
        required: yes
        source: "Batch 表单编排"
        resolver: item
        constraints:
          - "必须包含已解析 Item 外键。"
          - "不允许模型凭空生成业务批号；如需系统自动命名，应遵循 ERPNext 配置。"
        repair: ["resolve_entity", "present_candidates", "ask_clarification", "validate_before_execute"]

  erpnext.stock.update_batch:
    purpose: "L4：更新 Batch 追溯主数据；可能影响已发生库存追溯。"
    expose: agent_visible
    allowed_roles: ["仓库主管"]
    confirm: submit_confirm
    backend_mapping:
      doctypes: ["Batch"]
    audit_fields: ["name", "data", "confirmation"]
    repair: ["resolve_entity", "ask_clarification", "validate_before_execute", "erpnext_validation_error", "permission_denied"]
    business_contract:
      - "必须有明确 confirmation，包含确认人、时间、原因和确认文本。"
      - "已发生库存移动的批次变更必须保留审计说明。"
      - "制度配置项：有库存流水的 Batch 禁止修改 item/batch_id；expiry_date、disabled、备注和自定义字段可在主管确认后修改，质量/财务字段需对应审批。"
    parameters:
      name:
        required: yes
        source: "Batch Resolver"
        resolver: batch
        constraints:
          - "必须是已存在的 ERPNext Batch.name。"
