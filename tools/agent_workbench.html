<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Nexterp Agent 工作台</title>
    <link rel="stylesheet" href="/workbench-assets/workbench.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><div class="brand-mark">N</div><span>Nexterp Agent 工作台</span></div>
      <div class="top-actions">
        <button id="contextToggle" class="mobile-toggle">项目与员工</button>
        <button id="operationsToggle" class="mobile-toggle ops-toggle">我的工作</button>
        <button id="developerToggle" class="dev-toggle">开发者模式</button>
        <div id="healthText" class="health">正在连接</div>
      </div>
    </header>

    <div class="workspace">
      <aside id="contextPanel" class="context-panel">
        <div class="section-label">当前项目</div>
        <div class="project-picker">
          <select id="projectSelect" aria-label="选择项目"></select>
          <div id="projectMeta" class="project-meta"></div>
        </div>
        <div class="section-label">项目团队</div>
        <div id="employeeList"></div>
      </aside>

      <main class="conversation">
        <div class="conversation-head">
          <div class="conversation-identity"><strong id="assistantName">员工工作助理</strong><span id="assistantContext">请选择项目和员工</span></div>
          <div class="permission-scope">ERPNext 本人权限</div>
        </div>
        <div id="messages" class="messages">
          <div id="welcome" class="welcome">
            <h1>今天需要处理什么？</h1>
            <p>我会先查询真实业务数据，涉及写入时再请你确认。</p>
            <div class="quick-actions">
              <button data-example="帮我创建一张材料申请">创建材料申请</button>
              <button data-example="查询当前项目仓库的库存">查询库存</button>
              <button data-example="把基地库存调拨到当前项目仓库">库存调拨</button>
              <button data-example="从当前项目仓库给施工班组领料">项目领料</button>
              <button data-example="查看我负责的待办和异常">查看待办</button>
            </div>
          </div>
        </div>
        <div>
          <div id="confirmBar" class="confirm-bar">
            <div class="confirm-copy"><strong>尚未创建单据</strong><span>操作已准备好，确认后才会使用当前员工身份写入 ERPNext。</span></div>
            <div class="confirm-actions"><button id="cancelConfirm" class="button">取消</button><button id="executeBtn" class="button danger">确认执行</button></div>
          </div>
          <div class="composer">
            <textarea id="input" placeholder="描述你要完成的工作，例如：帮我买100双帆布手套，明天要到货"></textarea>
            <div class="composer-footer">
              <div id="actorLabel" class="actor">请选择员工</div>
              <div class="button-row"><button id="clearBtn" class="button">新会话</button><button id="previewBtn" class="button primary">发送</button></div>
            </div>
          </div>
        </div>
      </main>

      <aside id="operationsPanel" class="operations-panel">
        <div class="operations-tabs">
          <button class="operations-tab active" data-panel="inbox">待我处理</button>
          <button class="operations-tab" data-panel="mine">我的申请</button>
          <button class="operations-tab" data-panel="pending">待采购</button>
          <button class="operations-tab" data-panel="progress">采购进度</button>
          <button class="operations-tab" data-panel="recent">最近单据</button>
          <button class="operations-tab" data-panel="stock">库存作业</button>
          <button class="operations-tab" data-panel="exceptions">异常退回</button>
          <button class="operations-tab developer-only" data-panel="steps">执行过程</button>
          <button class="operations-tab developer-only" data-panel="technical">技术数据</button>
        </div>
        <div id="contextSummary" class="context-summary"></div>
        <div id="operationsBody" class="operations-body"></div>
      </aside>
    </div>

    <div id="drawerShade" class="drawer-shade"></div>
    <section id="documentDrawer" class="document-drawer" aria-label="业务单据详情">
      <div class="drawer-head">
        <div id="drawerTitle" class="drawer-title"><h2>业务单据</h2><p>正在读取</p></div>
        <button id="drawerClose" class="drawer-close" aria-label="关闭单据详情">×</button>
      </div>
      <div id="drawerBody" class="drawer-body"></div>
    </section>

    <script src="/workbench-assets/workbench.js" defer></script>
  </body>
</html>
