  erpnext.accounting.create_purchase_invoice_from_purchase_receipt_draft:
    purpose: "L3：从已提交 Purchase Receipt 创建 Purchase Invoice 草稿，不提交。"
    expose: agent_visible
    allowed_roles: ["财务"]
    confirm: user_confirm
    backend_mapping:
      doctypes: ["Purchase Receipt", "Purchase Receipt Item", "Purchase Invoice", "Purchase Invoice Item"]
      notes: "先读取 Purchase Receipt，校验可开票数量，再创建 Purchase Invoice 草稿。"
    audit_fields: ["purchase_receipt", "posting_date", "bill_no", "bill_date", "company", "selected_items"]
    repair: ["resolve_entity", "ask_clarification", "present_candidates", "inject_context", "validate_before_execute", "permission_denied", "erpnext_validation_error"]
    business_contract:
      - "只创建 docstatus=0 的采购发票草稿；提交必须另行使用 submit_financial_document 并经过 financial_confirm。"
      - "purchase_receipt 必须是已提交、非退货的 Purchase Receipt。"
      - "selected_items 如填写，必须能唯一匹配来源收货行；数量必须大于 0 且不超过可开票数量。"
      - "posting_date、bill_date 必须是明确 ISO 日期；bill_no 由供应商发票原文提供。"
      - "默认口径：有供应商发票原件时 bill_no/bill_date 视为必填；缺失时只能建草稿并提示补录，重复供应商发票号必须前置查询并由 ERPNext 再校验。"
    parameters:
      purchase_receipt:
        required: yes
        source: "Purchase Receipt Resolver"
        resolver: purchase_receipt
        constraints:
          - "必须是 ERPNext Purchase Receipt.name。"
          - "必须是已提交且非退货单。"
        repair: ["resolve_entity", "present_candidates", "ask_clarification", "erpnext_validation_error"]
      posting_date:
        source: "Date Resolver"
        resolver: date
        constraints:
          - "必须是 ISO 日期。"
        repair: ["ask_clarification", "inject_context"]
      bill_no:
        source: "供应商发票原文 / 用户确认"
        constraints:
          - "不应由模型编造。"
        repair: ["ask_clarification"]
      bill_date:
        source: "Date Resolver"
        resolver: date
        constraints:
          - "必须是 ISO 日期。"
        repair: ["ask_clarification", "inject_context"]
      company:
        source: "Company Resolver / Purchase Receipt Context"
        resolver: company
        constraints:
          - "必须是 ERPNext Company.name 全称；默认可来自收货单。"
        repair: ["inject_context", "resolve_entity"]
      selected_items:
        source: "收货行选择 / Runtime Builder"
        constraints:
          - "数组每行 qty 必须大于 0。"
          - "purchase_receipt_item 必须来自 Purchase Receipt Item Resolver，或 item_code 唯一匹配来源行。"
          - "rate 如填写必须大于等于 0。"
        repair: ["resolve_entity", "present_candidates", "ask_clarification", "validate_before_execute"]

