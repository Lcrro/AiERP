  erpnext.accounting.prepare_payment_allocation:
    purpose: "L1：准备 Payment Entry 引用发票分配，不创建、不提交付款单。"
    expose: agent_visible
    allowed_roles: ["财务"]
    confirm: none
    backend_mapping:
      doctypes: ["Sales Invoice", "Purchase Invoice"]
      notes: "读取已提交且未结清的发票，返回分配建议。"
    audit_fields: ["party_type", "party", "payment_type", "invoice_doctype", "invoice_names", "company", "paid_amount"]
    repair: ["resolve_entity", "ask_clarification", "present_candidates", "inject_context", "validate_before_execute", "permission_denied", "erpnext_validation_error"]
    business_contract:
      - "只准备付款分配候选，不创建 Payment Entry，不触发财务过账。"
      - "party_type 必须是 Customer 或 Supplier；party 必须解析为对应 Customer/Supplier 主键。"
      - "invoice_names 如填写，必须来自 Invoice Resolver；每张发票应为已提交且有未结清金额。"
      - "paid_amount 必须大于等于 0；allocations 不得超过发票未结清金额。"
      - "制度配置项：部分核销、预收预付、折扣和差额处理策略必须来自公司财务制度；Agent 只能按已解析规则生成候选分配。"
    parameters:
      party_type:
        required: yes
        source: "用户选择 / Runtime 推断"
        constraints:
          - "只能是 Customer 或 Supplier。"
        repair: ["ask_clarification", "validate_before_execute"]
      party:
        required: yes
        source: "Customer/Supplier Resolver"
        resolver: party
        constraints:
          - "必须与 party_type 匹配。"
          - "Customer 场景必须是 ERPNext Customer.name；Supplier 场景必须是 ERPNext Supplier.name。"
        repair: ["resolve_entity", "present_candidates", "ask_clarification"]
      payment_type:
        source: "Runtime 推断 / 用户确认"
        constraints:
          - "Customer 默认 Receive，Supplier 默认 Pay；与 party_type 不一致时必须追问。"
        repair: ["ask_clarification", "validate_before_execute"]
      invoice_doctype:
        source: "Runtime 推断 / 用户确认"
        constraints:
          - "Customer 通常对应 Sales Invoice，Supplier 通常对应 Purchase Invoice。"
        repair: ["ask_clarification", "validate_before_execute"]
      invoice_names:
        source: "Invoice Resolver / 用户选择"
        resolver: invoice
        constraints:
          - "每个值必须是 ERPNext Sales Invoice.name 或 Purchase Invoice.name。"
          - "必须与 invoice_doctype 和 party 匹配。"
        repair: ["resolve_entity", "present_candidates", "ask_clarification"]
      company:
        source: "Company Resolver / Runtime Context"
        resolver: company
        constraints:
          - "必须是 ERPNext Company.name 全称。"
        repair: ["inject_context", "resolve_entity"]
      paid_amount:
        source: "用户确认金额 / Runtime 计算"
        constraints:
          - "必须大于等于 0。"
        repair: ["ask_clarification", "validate_before_execute"]
      allocations:
        source: "Runtime Builder / 用户确认"
        constraints:
          - "键必须对应已解析 invoice_names 或候选发票。"
          - "分配金额不得为负。"
        repair: ["validate_before_execute", "ask_clarification"]

  erpnext.accounting.prepare_invoice_taxes:
    purpose: "L1：准备销售/采购发票税行，不创建发票。"
    expose: agent_visible
    allowed_roles: ["财务"]
    confirm: none
    backend_mapping:
      doctypes: ["Sales Taxes and Charges Template", "Purchase Taxes and Charges Template"]
      notes: "可读取税费模板并根据输入明细准备 taxes 行；最终总额仍由 ERPNext 草稿创建校验。"
    audit_fields: ["invoice_type", "taxes_and_charges", "items", "taxes", "net_total"]
    repair: ["resolve_entity", "ask_clarification", "present_candidates", "validate_before_execute", "permission_denied", "erpnext_validation_error"]
    business_contract:
      - "只准备税行，不创建、不修改、不提交发票。"
      - "invoice_type 必须与后续发票类型一致。"
      - "taxes_and_charges 如填写，必须来自税费模板 resolver，不能使用未确认的模板名。"
      - "显式 taxes 行必须来自用户确认或受控模板展开，不能由模型任意拼税率和科目。"
      - "制度配置项：税率、含税/未税、进项/销项税科目和四舍五入口径必须来自公司财务制度与 ERPNext 税费模板，禁止模型自行编造税行。"
    parameters:
      invoice_type:
        required: yes
        source: "用户选择 / Runtime 推断"
        constraints:
          - "只能使用 schema 枚举值。"
        repair: ["ask_clarification", "validate_before_execute"]
      taxes_and_charges:
        source: "Tax Template Resolver"
        resolver: tax_template
        constraints:
          - "必须是对应销售/采购税费模板的 ERPNext name。"
        repair: ["resolve_entity", "present_candidates", "ask_clarification"]
      items:
        source: "发票明细编排"
        constraints:
          - "用于计算税基；物料、科目、成本中心等外键必须已解析。"
        repair: ["validate_before_execute", "resolve_entity"]
      taxes:
        source: "用户确认 / 模板展开"
        constraints:
          - "显式税行必须经过财务确认或模板展开；不得由模型自由编造税率、科目。"
        repair: ["ask_clarification", "validate_before_execute"]
      net_total:
        source: "Runtime 计算 / 用户确认"
        constraints:
          - "必须大于等于 0。"
        repair: ["validate_before_execute"]

  erpnext.accounting.prepare_bank_reconciliation:
    purpose: "L1：准备银行流水与 Payment Entry 候选匹配，不执行核销。"
    expose: agent_visible
    allowed_roles: ["财务"]
    confirm: none
    backend_mapping:
      doctypes: ["Bank Transaction", "Payment Entry"]
      notes: "只读读取 Bank Transaction 与已提交 Payment Entry 候选。"
    audit_fields: ["company", "bank_account", "status", "from_date", "to_date", "limit"]
    repair: ["resolve_entity", "ask_clarification", "present_candidates", "inject_context", "validate_before_execute", "permission_denied", "erpnext_validation_error"]
    business_contract:
      - "只准备银行对账候选，不匹配、不替换、不过账。"
      - "company、bank_account 必须来自 resolver 或已校验上下文。"
      - "日期范围必须是明确 ISO 日期；to_date 不得早于 from_date。"
      - "apply_bank_reconciliation 前必须由财务复核具体 Bank Transaction 和 Payment Entry 匹配关系。"
    parameters:
      company:
        source: "Company Resolver / Runtime Context"
        resolver: company
        constraints:
          - "必须是 ERPNext Company.name 全称。"
        repair: ["inject_context", "resolve_entity"]
      bank_account:
        source: "Bank Account Resolver"
        resolver: bank_account
        constraints:
          - "必须是 ERPNext Bank Account.name 或系统认可的银行账户主键。"
        repair: ["resolve_entity", "present_candidates", "ask_clarification"]
      status:
        source: "用户选择 / Runtime 默认"
        constraints:
          - "用于筛选 Bank Transaction.status；当前 schema 未枚举，执行前需校验。"
        repair: ["ask_clarification", "validate_before_execute"]
      from_date:
        source: "Date Resolver"
        resolver: date
        constraints:
          - "必须是 ISO 日期。"
        repair: ["ask_clarification", "inject_context"]
      to_date:
        source: "Date Resolver"
        resolver: date
        constraints:
          - "必须是 ISO 日期。"
          - "不得早于 from_date。"
        repair: ["ask_clarification", "validate_before_execute"]
      limit:
        source: "Runtime 默认值"
        constraints:
          - "默认由 Runtime 控制，避免一次返回过多候选。"

  erpnext.accounting.apply_bank_reconciliation:
    purpose: "L5_FINANCIAL：在明确财务确认后应用银行核销匹配。"
    expose: agent_visible
    allowed_roles: ["财务"]
    confirm: financial_confirm
    backend_mapping:
      doctypes: ["Bank Transaction", "Payment Entry"]
      methods: ["agent_bridge.api.reconcile_bank_transaction"]
    audit_fields: ["bank_transaction", "matches", "replace_existing", "remarks", "confirmation"]
    repair: ["resolve_entity", "ask_clarification", "present_candidates", "validate_before_execute", "permission_denied", "erpnext_validation_error"]
    business_contract:
      - "必须带 financial_confirm；禁止在缺少确认元数据时执行。"
      - "只匹配既有 Payment Entry 到一个 Bank Transaction；不创建新的 Payment Entry 或 Journal Entry。"
      - "bank_transaction 必须来自 Bank Transaction Resolver。"
      - "matches[].payment_entry 必须来自 Payment Entry Resolver；allocated_amount 必须大于 0。"
      - "replace_existing=true 会替换既有匹配，必须在确认摘要中明确说明。"
      - "执行前应展示银行流水、付款单、分配金额和替换策略供财务确认。"
    parameters:
      bank_transaction:
        required: yes
        source: "Bank Transaction Resolver"
        resolver: bank_transaction
        constraints:
          - "必须是 ERPNext Bank Transaction.name。"
        repair: ["resolve_entity", "present_candidates", "ask_clarification"]
      matches:
        required: yes
        source: "prepare_bank_reconciliation 候选 + 财务确认"
        resolver: payment_entry
        constraints:
          - "数组至少 1 行。"
          - "matches[].payment_entry 必须是 ERPNext Payment Entry.name。"
          - "matches[].payment_document 必须与 payment_entry 指向同一付款文档。"
          - "matches[].allocated_amount 必须大于 0。"
        repair: ["resolve_entity", "ask_clarification", "validate_before_execute"]
      replace_existing:
        source: "财务确认"
        constraints:
          - "默认为 false；true 时必须在确认摘要中说明替换原因。"
        repair: ["ask_clarification"]
      remarks:
        source: "财务说明"
        constraints:
          - "建议记录核销依据或对账说明。"
      confirmation:
        required: yes
        source: "Financial Confirmation"
        constraints:
          - "必须包含财务确认元数据，且确认摘要覆盖 bank_transaction、matches 和 replace_existing。"
        repair: ["ask_clarification", "permission_denied", "validate_before_execute"]

  erpnext.accounting.create_budget_draft:
    purpose: "L3：创建 Budget 草稿，不提交预算控制。"
    expose: agent_visible
    allowed_roles: ["财务"]
    confirm: user_confirm
    backend_mapping:
      doctypes: ["Budget", "Budget Account"]
    audit_fields: ["data"]
    repair: ["resolve_entity", "ask_clarification", "present_candidates", "inject_context", "validate_before_execute", "permission_denied", "erpnext_validation_error"]
    business_contract:
      - "只创建 docstatus=0 的预算草稿；预算提交或启用控制必须另行确认。"
      - "创建前必须确认公司、会计年度、预算维度、预算账户/金额和控制动作。"
      - "data.company、data.fiscal_year、accounts[].account、cost_center/project 等预算维度必须由 resolver 或已校验上下文生成。"
      - "制度配置项：预算 against 维度、月度分解、超预算动作和提交流程必须来自公司财务制度与 ERPNext Budget 配置。"
    parameters:
      data:
        required: yes
        source: "预算表单编排"
        constraints:
          - "必须是 Budget draft payload；docstatus 会被服务端强制为 0。"
          - "data.company 必须来自 Company Resolver。"
          - "data.fiscal_year 必须来自 Fiscal Year Resolver。"
          - "accounts[].account 必须来自 Account Resolver。"
          - "cost_center 如填写必须来自 Cost Center Resolver。"
          - "完整 payload 必须进入审计日志。"
        repair: ["resolve_entity", "ask_clarification", "validate_before_execute", "erpnext_validation_error"]

  erpnext.accounting.update_budget_draft:
    purpose: "L3：更新 Budget 草稿，保持 docstatus=0，不提交预算控制。"
    expose: agent_visible
    allowed_roles: ["财务"]
    confirm: user_confirm
    backend_mapping:
      doctypes: ["Budget", "Budget Account"]
    audit_fields: ["name", "data"]
    repair: ["resolve_entity", "ask_clarification", "present_candidates", "validate_before_execute", "permission_denied", "erpnext_validation_error"]
    business_contract:
      - "只能更新 Budget 草稿；服务端会强制 docstatus=0。"
      - "更新前必须明确预算单名称、变更字段、变更原因和影响范围。"
      - "name 必须来自预算查询结果或 Budget Resolver，不允许模型编造。"
      - "data 中的 company、fiscal_year、account、cost_center 等外键必须由 resolver 或已校验上下文生成。"
      - "默认口径：该工具不得把已提交预算回写为草稿；已提交预算调整应走取消/修订或专门预算调整流程，并受 ERPNext 权限限制。"
    parameters:
      name:
        required: yes
        source: "Budget Resolver / search_budgets 结果"
        resolver: budget
        constraints:
          - "必须是 ERPNext Budget.name。"
        repair: ["resolve_entity", "present_candidates", "ask_clarification"]
      data:
        required: yes
        source: "预算变更表单编排"
        constraints:
          - "必须是 Budget draft update payload；docstatus 会被服务端强制为 0。"
          - "data.company 必须来自 Company Resolver。"
          - "data.fiscal_year 必须来自 Fiscal Year Resolver。"
          - "accounts[].account 必须来自 Account Resolver。"
          - "cost_center 如填写必须来自 Cost Center Resolver。"
          - "完整 payload 必须进入审计日志。"
        repair: ["resolve_entity", "ask_clarification", "validate_before_execute", "erpnext_validation_error"]

  erpnext.accounting.submit_financial_document:
    purpose: "L5_FINANCIAL：提交会影响总账或财务状态的财务单据。"
    expose: agent_visible
    allowed_roles: ["财务"]
    confirm: financial_confirm
    backend_mapping:
      doctypes: ["Journal Entry", "Payment Entry", "Sales Invoice", "Purchase Invoice", "Period Closing Voucher"]
      notes: "仅提交白名单财务 DocType。"
    audit_fields: ["doctype", "name", "confirmation"]
    repair: ["resolve_entity", "ask_clarification", "present_candidates", "validate_before_execute", "permission_denied", "erpnext_validation_error"]
    business_contract:
      - "必须带 financial_confirm；禁止在缺少确认元数据时执行。"
      - "只允许提交 schema 枚举中的财务 DocType。"
      - "提交前必须展示单据类型、单据号、金额/影响摘要、公司、日期和关键外键供财务确认。"
      - "name 必须来自对应 DocType 的 resolver 或刚创建的草稿结果；不能由模型编造。"
      - "Journal Entry、Payment Entry、Sales Invoice、Purchase Invoice、Period Closing Voucher 提交后可能产生或改变总账影响。"
      - "默认口径：财务提交前必须运行可用的 GL 影响预览、税额复核和审批流状态检查；缺少自动校验能力时升级为财务人工确认。"
    parameters:
      doctype:
        required: yes
        source: "Runtime 枚举 / 草稿上下文"
        constraints:
          - "只能使用 schema 枚举值。"
        repair: ["ask_clarification", "validate_before_execute"]
      name:
        required: yes
        source: "Financial Document Resolver / 草稿创建结果"
        resolver: financial_document
        constraints:
          - "必须是 doctype 对应的 ERPNext 文档 name。"
          - "Sales Invoice/Purchase Invoice 必须来自 Invoice Resolver。"
          - "Payment Entry 必须来自 Payment Entry Resolver。"
        repair: ["resolve_entity", "present_candidates", "ask_clarification"]
      confirmation:
        required: yes
        source: "Financial Confirmation"
        constraints:
          - "必须包含财务确认元数据，且确认摘要覆盖 doctype、name 和财务影响。"
        repair: ["ask_clarification", "permission_denied", "validate_before_execute"]
