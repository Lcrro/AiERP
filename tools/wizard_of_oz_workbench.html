<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Nexterp Wizard of Oz ToolCall 工作台</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --surface: #ffffff;
        --surface-2: #f0f2f5;
        --line: #d9dde3;
        --text: #20242a;
        --muted: #68707c;
        --strong: #111418;
        --accent: #1264a3;
        --accent-soft: #e7f1fa;
        --danger: #b42318;
        --danger-soft: #fff0ee;
        --ok: #067647;
        --warn: #9a6700;
        --shadow: 0 10px 28px rgba(22, 28, 36, 0.08);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 22px;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(10px);
      }

      h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0;
      }

      h2,
      h3 {
        margin: 0;
        font-size: 14px;
        letter-spacing: 0;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      button {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        color: var(--strong);
        cursor: pointer;
        transition:
          border-color 0.15s ease,
          background 0.15s ease,
          color 0.15s ease;
      }

      button:hover {
        border-color: #aab2bd;
      }

      button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }

      button.danger {
        border-color: #f3b7b1;
        background: var(--danger-soft);
        color: var(--danger);
      }

      button.ghost {
        background: transparent;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }

      .field {
        display: grid;
        gap: 4px;
      }

      .field label {
        color: var(--muted);
        font-size: 12px;
      }

      .field input,
      .field select,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--text);
        outline: none;
      }

      .field input,
      .field select {
        height: 34px;
        padding: 0 10px;
      }

      textarea {
        min-height: 260px;
        padding: 12px;
        resize: vertical;
        font-family: "Cascadia Mono", Consolas, monospace;
        font-size: 12px;
        line-height: 1.5;
      }

      .switch {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 34px;
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
      }

      .switch input {
        width: 16px;
        height: 16px;
      }

      main {
        display: grid;
        grid-template-columns: minmax(260px, 320px) minmax(420px, 1fr) minmax(360px, 0.9fr);
        gap: 14px;
        padding: 14px;
      }

      .panel {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
      }

      .panel-body {
        padding: 12px 14px;
      }

      .stack {
        display: grid;
        gap: 12px;
      }

      .setup-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .setup-row button,
      .actions button {
        min-height: 34px;
        padding: 0 12px;
      }

      .group {
        display: grid;
        gap: 6px;
        padding: 10px 0;
        border-top: 1px solid var(--line);
      }

      .group:first-child {
        border-top: 0;
        padding-top: 0;
      }

      .tool-button {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        width: 100%;
        padding: 9px 10px;
        text-align: left;
      }

      .tool-button.active {
        border-color: var(--accent);
        background: var(--accent-soft);
      }

      .tool-label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 600;
      }

      .tool-actor {
        grid-column: 1 / -1;
        color: var(--muted);
        font-size: 12px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 34px;
        height: 22px;
        padding: 0 7px;
        border-radius: 999px;
        background: var(--surface-2);
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .badge.write {
        background: var(--danger-soft);
        color: var(--danger);
      }

      .badge.read {
        background: #ecfdf3;
        color: var(--ok);
      }

      .meta-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .meta {
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface-2);
        min-width: 0;
      }

      .meta span {
        display: block;
        color: var(--muted);
        font-size: 11px;
      }

      .meta strong {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        margin-top: 3px;
        font-size: 13px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      pre {
        overflow: auto;
        min-height: 180px;
        max-height: 58vh;
        margin: 0;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #0f1720;
        color: #d7e0ea;
        font-family: "Cascadia Mono", Consolas, monospace;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-height: 34px;
        padding: 7px 10px;
        border-radius: 6px;
        background: var(--surface-2);
        color: var(--muted);
        font-size: 13px;
      }

      .status.ok {
        background: #ecfdf3;
        color: var(--ok);
      }

      .status.fail {
        background: var(--danger-soft);
        color: var(--danger);
      }

      .tool-search {
        display: grid;
        gap: 8px;
      }

      .tool-list {
        overflow: auto;
        max-height: 260px;
        border: 1px solid var(--line);
        border-radius: 6px;
      }

      .tool-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        width: 100%;
        padding: 9px 10px;
        border: 0;
        border-bottom: 1px solid var(--line);
        border-radius: 0;
        text-align: left;
      }

      .tool-row:last-child {
        border-bottom: 0;
      }

      .tool-row small {
        grid-column: 1 / -1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--muted);
      }

      .muted {
        color: var(--muted);
      }

      @media (max-width: 1120px) {
        main {
          grid-template-columns: 1fr;
        }

        pre {
          max-height: 360px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Nexterp Wizard of Oz ToolCall 工作台</h1>
        <div class="muted" id="companyLine">加载中</div>
      </div>
      <div class="toolbar">
        <div class="field">
          <label for="profileInput">Profile</label>
          <input id="profileInput" value="local" />
        </div>
        <label class="switch">
          <input type="checkbox" id="allowWriteInput" />
          允许写入 ToolCall
        </label>
      </div>
    </header>

    <main>
      <section class="panel">
        <div class="panel-head">
          <h2>沙盘与预设按钮</h2>
          <span class="badge" id="toolCount">0</span>
        </div>
        <div class="panel-body stack">
          <div class="setup-row">
            <button id="setupDryRunBtn">基座检查</button>
            <button id="setupApplyBtn" class="danger">写入/补齐基座</button>
          </div>
          <div id="groups" class="stack"></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>当前 ToolCall</h2>
          <span class="badge" id="riskBadge">L0</span>
        </div>
        <div class="panel-body stack">
          <div class="meta-grid">
            <div class="meta">
              <span>角色</span>
              <strong id="actorText">未选择</strong>
            </div>
            <div class="meta">
              <span>Tool</span>
              <strong id="toolText">未选择</strong>
            </div>
          </div>
          <div class="field">
            <label for="reasonInput">Reason</label>
            <input id="reasonInput" placeholder="这次为什么调用这个 ToolCall" />
          </div>
          <div class="field">
            <label for="argsInput">Arguments JSON</label>
            <textarea id="argsInput" spellcheck="false">{}</textarea>
          </div>
          <div class="actions">
            <button id="formatBtn">格式化 JSON</button>
            <button id="executeBtn" class="primary">执行 ToolCall</button>
          </div>
          <div class="tool-search">
            <div class="field">
              <label for="toolSearchInput">全部 ToolCall 搜索</label>
              <input id="toolSearchInput" placeholder="例如 material_request、stock、user" />
            </div>
            <div class="tool-list" id="allTools"></div>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>执行结果</h2>
          <button class="ghost" id="clearResultBtn">清空</button>
        </div>
        <div class="panel-body stack">
          <div class="status" id="statusLine">等待执行</div>
          <div>
            <h3>ToolCall</h3>
            <pre id="callOutput">{}</pre>
          </div>
          <div>
            <h3>ToolResult</h3>
            <pre id="resultOutput">{}</pre>
          </div>
        </div>
      </section>
    </main>

    <script>
      const state = {
        catalog: null,
        selected: null,
        allTools: [],
      };

      const el = (id) => document.getElementById(id);

      function pretty(value) {
        return JSON.stringify(value, null, 2);
      }

      function riskClass(riskLevel) {
        if (riskLevel === "L0" || riskLevel === "L1") return "read";
        return "write";
      }

      function showStatus(text, type = "") {
        const node = el("statusLine");
        node.className = `status ${type}`.trim();
        node.textContent = text;
      }

      function parseArgs() {
        const raw = el("argsInput").value.trim();
        return raw ? JSON.parse(raw) : {};
      }

      function selectedPayload() {
        if (!state.selected) {
          throw new Error("请先选择一个 ToolCall。");
        }
        return {
          profile: el("profileInput").value.trim() || "local",
          tool: state.selected.tool,
          arguments: parseArgs(),
          reason: el("reasonInput").value.trim() || state.selected.description || "",
          user_context: {
            actor: state.selected.actor || "Wizard",
            wizard_of_oz: true,
          },
          allow_write: el("allowWriteInput").checked,
        };
      }

      function selectTool(tool) {
        state.selected = tool;
        el("actorText").textContent = tool.actor || "自定义";
        el("toolText").textContent = tool.tool;
        el("riskBadge").textContent = tool.risk_level || "L0";
        el("riskBadge").className = `badge ${riskClass(tool.risk_level)}`;
        el("reasonInput").value = tool.description || "";
        el("argsInput").value = pretty(tool.arguments || {});
        el("callOutput").textContent = pretty({
          tool: tool.tool,
          arguments: tool.arguments || {},
          risk_level: tool.risk_level,
          user_context: { actor: tool.actor || "Wizard", wizard_of_oz: true },
        });
        document.querySelectorAll(".tool-button").forEach((node) => {
          node.classList.toggle("active", node.dataset.id === tool.id);
        });
      }

      function renderGroups(catalog) {
        const groupsNode = el("groups");
        groupsNode.innerHTML = "";
        catalog.groups.forEach((group) => {
          const groupNode = document.createElement("div");
          groupNode.className = "group";
          const title = document.createElement("h3");
          title.textContent = group.name;
          groupNode.appendChild(title);

          group.tools.forEach((tool) => {
            const btn = document.createElement("button");
            btn.className = "tool-button";
            btn.dataset.id = tool.id;
            btn.innerHTML = `
              <span class="tool-label"></span>
              <span class="badge ${riskClass(tool.risk_level)}"></span>
              <span class="tool-actor"></span>
            `;
            btn.querySelector(".tool-label").textContent = tool.label;
            btn.querySelector(".badge").textContent = tool.risk_level;
            btn.querySelector(".tool-actor").textContent = `${tool.actor} · ${tool.tool}`;
            btn.addEventListener("click", () => selectTool(tool));
            groupNode.appendChild(btn);
          });

          groupsNode.appendChild(groupNode);
        });
        el("toolCount").textContent = catalog.groups.reduce((sum, group) => sum + group.tools.length, 0);
      }

      function placeholderArgs(required) {
        const args = {};
        (required || []).forEach((name) => {
          args[name] = "";
        });
        return args;
      }

      function renderAllTools() {
        const query = el("toolSearchInput").value.trim().toLowerCase();
        const node = el("allTools");
        const filtered = state.allTools
          .filter((tool) => {
            const text = `${tool.name} ${tool.description} ${(tool.required || []).join(" ")}`.toLowerCase();
            return !query || text.includes(query);
          })
          .slice(0, 80);
        node.innerHTML = "";
        filtered.forEach((tool) => {
          const btn = document.createElement("button");
          btn.className = "tool-row";
          btn.innerHTML = `
            <strong></strong>
            <span class="badge ${riskClass(tool.risk_level)}"></span>
            <small></small>
          `;
          btn.querySelector("strong").textContent = tool.name;
          btn.querySelector(".badge").textContent = tool.risk_level;
          btn.querySelector("small").textContent = tool.description || "无说明";
          btn.addEventListener("click", () => {
            selectTool({
              id: `custom-${tool.name}`,
              group: "全部 ToolCall",
              label: tool.name,
              actor: "Wizard 手动测试",
              tool: tool.name,
              arguments: placeholderArgs(tool.required),
              writes: !["L0", "L1"].includes(tool.risk_level),
              description: tool.description || "",
              risk_level: tool.risk_level,
            });
          });
          node.appendChild(btn);
        });
      }

      async function loadCatalog() {
        showStatus("加载 ToolCall catalog");
        const profile = encodeURIComponent(el("profileInput").value.trim() || "local");
        const response = await fetch(`/api/catalog?profile=${profile}`);
        const payload = await response.json();
        if (!payload.ok) {
          throw new Error(payload.error || "catalog 加载失败");
        }
        state.catalog = payload.catalog;
        state.allTools = payload.catalog.all_tools || [];
        el("companyLine").textContent = `${payload.catalog.company} · profile=${payload.catalog.default_profile}`;
        el("profileInput").value = payload.catalog.default_profile || "local";
        renderGroups(payload.catalog);
        renderAllTools();
        const firstTool = payload.catalog.groups?.[0]?.tools?.[0];
        if (firstTool) selectTool(firstTool);
        showStatus("已加载", "ok");
      }

      async function executeSelected() {
        let payload;
        try {
          payload = selectedPayload();
        } catch (error) {
          showStatus(error.message, "fail");
          return;
        }
        el("callOutput").textContent = pretty(payload);
        showStatus("执行中");
        try {
          const response = await fetch("/api/execute", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const result = await response.json();
          el("callOutput").textContent = pretty(result.tool_call || payload);
          el("resultOutput").textContent = pretty(result.result || result);
          showStatus(result.ok ? "执行成功" : result.blocked ? "安全模式已拦截" : "执行失败", result.ok ? "ok" : "fail");
        } catch (error) {
          showStatus(error.message, "fail");
        }
      }

      async function runSetup(apply) {
        const confirmed = !apply || window.confirm("将写入或补齐本地 sandbox 基座数据，确认继续？");
        if (!confirmed) return;
        showStatus(apply ? "写入/补齐基座中" : "检查基座中");
        const response = await fetch("/api/setup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            profile: el("profileInput").value.trim() || "local",
            apply,
          }),
        });
        const result = await response.json();
        el("callOutput").textContent = pretty({ setup: apply ? "apply" : "dry_run" });
        el("resultOutput").textContent = pretty(result);
        showStatus(result.ok ? "基座处理完成" : "基座处理失败", result.ok ? "ok" : "fail");
      }

      el("formatBtn").addEventListener("click", () => {
        try {
          el("argsInput").value = pretty(parseArgs());
          showStatus("JSON 已格式化", "ok");
        } catch (error) {
          showStatus(error.message, "fail");
        }
      });
      el("executeBtn").addEventListener("click", executeSelected);
      el("setupDryRunBtn").addEventListener("click", () => runSetup(false));
      el("setupApplyBtn").addEventListener("click", () => runSetup(true));
      el("clearResultBtn").addEventListener("click", () => {
        el("callOutput").textContent = "{}";
        el("resultOutput").textContent = "{}";
        showStatus("等待执行");
      });
      el("toolSearchInput").addEventListener("input", renderAllTools);
      el("profileInput").addEventListener("change", loadCatalog);

      loadCatalog().catch((error) => showStatus(error.message, "fail"));
    </script>
  </body>
</html>
