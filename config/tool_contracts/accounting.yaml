      - "如从采购收货生成，优先使用 create_purchase_invoice_from_purchase_receipt_draft 保留来源行引用。"
      - "制度配置项：价税差异、费用归集和应付账款科目规则以公司财务制度、ERPNext 税费模板和服务端校验为准，Agent 只能使用解析出的模板或用户确认值。"
