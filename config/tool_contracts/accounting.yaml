version: 1
module: accounting
tools:
  erpnext.accounting.search_accounts:
    purpose: "L0：查询会计科目主数据，用于报表筛选、凭证草稿编排和科目解析。"
    expose: agent_visible
    allowed_roles: ["财务"]
    confirm: none
    backend_mapping:
      doctypes: ["Account"]
      notes: "只读 search_documents；默认按 lft asc 返回科目树。"
    audit_fields: ["company", "account_type", "filters", "limit"]
    repair: ["resolve_entity", "ask_clarification", "present_candidates", "inject_context", "validate_before_execute", "permission_denied", "erpnext_validation_error"]
    business_contract:
      - "仅用于读取 Account，不创建或修改科目。"
      - "company 必须解析成 ERPNext Company.name 全称；不能把用户简称直接写入 ToolCall。"
      - "filters、fields、order_by 必须由 Runtime 生成或校验，禁止模型直接拼接未校验的 Frappe filter DSL。"
    parameters:
      company:
        source: "Company Resolver / Runtime Context"
        resolver: company
        constraints:
          - "必须是 ERPNext Company.name 全称。"
        repair: ["inject_context", "resolve_entity"]
      account_type:
        source: "用户选择 / Runtime 枚举"
        constraints:
          - "用于缩小 Account.account_type，不应作为科目主键。"
      filters:
        source: "Runtime Builder"
        constraints:
          - "必须由编排层生成或白名单校验。"
        repair: ["validate_before_execute"]
      fields:
        source: "Runtime 默认 / Field Resolver"
        resolver: field
        constraints:
          - "字段必须存在于 Account meta。"
        repair: ["validate_before_execute"]
      limit:
        source: "Runtime 默认值"
        constraints:
          - "默认由 Runtime 控制，避免一次返回过多科目。"

  erpnext.accounting.search_cost_centers:
    purpose: "L0：查询成本中心主数据，用于报表筛选、预算和单据草稿编排。"
    expose: agent_visible
    allowed_roles: ["财务"]
    confirm: none
    backend_mapping:
      doctypes: ["Cost Center"]
      notes: "只读 search_documents；默认按 lft asc 返回成本中心树。"
    audit_fields: ["company", "filters", "limit"]
    repair: ["resolve_entity", "ask_clarification", "present_candidates", "inject_context", "validate_before_execute", "permission_denied", "erpnext_validation_error"]
    business_contract:
      - "仅用于读取 Cost Center，不创建或修改成本中心。"
      - "company 和 cost_center 相关筛选必须先解析，不允许使用简称直接作为 ERPNext 主键。"
      - "filters、fields、order_by 必须由 Runtime 生成或校验。"
    parameters:
      company:
        source: "Company Resolver / Runtime Context"
        resolver: company
        constraints:
          - "必须是 ERPNext Company.name 全称。"
        repair: ["inject_context", "resolve_entity"]
      filters:
        source: "Runtime Builder"
        constraints:
          - "如果包含 name/parent_cost_center/company，必须来自 resolver 或已校验上下文。"
        repair: ["validate_before_execute", "resolve_entity"]
      fields:
        source: "Runtime 默认 / Field Resolver"
        resolver: field
        constraints:
          - "字段必须存在于 Cost Center meta。"
        repair: ["validate_before_execute"]
      limit:
        source: "Runtime 默认值"

  erpnext.accounting.search_budgets:
    purpose: "L0：查询预算单据，用于预算状态核对和预算草稿更新前定位。"
    expose: agent_visible
    allowed_roles: ["财务"]
    confirm: none
    backend_mapping:
      doctypes: ["Budget"]
    audit_fields: ["company", "fiscal_year", "filters", "limit"]
    repair: ["resolve_entity", "ask_clarification", "present_candidates", "inject_context", "validate_before_execute", "permission_denied", "erpnext_validation_error"]
    business_contract:
      - "仅用于读取 Budget，不创建、不更新、不提交预算。"
      - "company、fiscal_year 必须解析为 ERPNext 主数据全称。"
      - "filters、fields、order_by 必须由 Runtime 生成或校验。"
    parameters:
      company:
        source: "Company Resolver / Runtime Context"
        resolver: company
        constraints:
          - "必须是 ERPNext Company.name 全称。"
        repair: ["inject_context", "resolve_entity"]
      fiscal_year:
        source: "Fiscal Year Resolver / 用户选择"
        resolver: fiscal_year
        constraints:
          - "必须是 ERPNext Fiscal Year.name。"
        repair: ["resolve_entity", "present_candidates", "ask_clarification"]
      filters:
        source: "Runtime Builder"
        constraints:
          - "预算维度筛选必须由编排层生成或白名单校验。"
        repair: ["validate_before_execute"]
      fields:
        source: "Runtime 默认 / Field Resolver"
        resolver: field
        constraints:
          - "字段必须存在于 Budget meta。"
        repair: ["validate_before_execute"]

  erpnext.accounting.search_fiscal_years:
    purpose: "L0：查询会计年度主数据，用于报表、预算和期间类单据编排。"
    expose: agent_visible
    allowed_roles: ["财务"]
    confirm: none
    backend_mapping:
      doctypes: ["Fiscal Year"]
    audit_fields: ["year", "disabled", "filters", "limit"]
    repair: ["resolve_entity", "ask_clarification", "present_candidates", "validate_before_execute", "permission_denied", "erpnext_validation_error"]
    business_contract:
      - "仅用于读取 Fiscal Year，不创建或修改会计年度。"
      - "用户说本年、上年、本会计年度时，必须由日期/会计年度 resolver 转换为 Fiscal Year.name。"
      - "filters、fields、order_by 必须由 Runtime 生成或校验。"
    parameters:
      year:
        source: "Fiscal Year Resolver / Date Resolver"
        resolver: fiscal_year
        constraints:
          - "可作为 Fiscal Year 检索输入，不能凭空编造会计年度名称。"
        repair: ["resolve_entity", "present_candidates", "ask_clarification"]
      disabled:
        source: "用户选择 / Runtime 默认"
      filters:
        source: "Runtime Builder"
        constraints:
          - "必须由编排层生成或白名单校验。"
        repair: ["validate_before_execute"]
      fields:
        source: "Runtime 默认 / Field Resolver"
        resolver: field
        constraints:
          - "字段必须存在于 Fiscal Year meta。"
        repair: ["validate_before_execute"]

  erpnext.accounting.search_accounting_periods:
    purpose: "L0：查询会计期间，用于报表日期范围和关账草稿编排前检查。"
    expose: agent_visible
    allowed_roles: ["财务"]
    confirm: none
    backend_mapping:
      doctypes: ["Accounting Period"]
    audit_fields: ["company", "from_date", "to_date", "filters", "limit"]
    repair: ["resolve_entity", "ask_clarification", "present_candidates", "inject_context", "validate_before_execute", "permission_denied", "erpnext_validation_error"]
    business_contract:
      - "仅用于读取 Accounting Period，不创建或修改期间。"
      - "日期范围必须是明确 ISO 日期，不接受本月左右、近期等模糊表达直接入参。"
      - "company 必须来自 resolver 或 Runtime 上下文。"
    parameters:
      company:
        source: "Company Resolver / Runtime Context"
        resolver: company
        constraints:
          - "必须是 ERPNext Company.name 全称。"
        repair: ["inject_context", "resolve_entity"]
      from_date:
        source: "Date Resolver"
        resolver: date
        constraints:
          - "必须是 ISO 日期。"
        repair: ["ask_clarification", "inject_context"]
      to_date:
        source: "Date Resolver"
        resolver: date
        constraints:
          - "必须是 ISO 日期。"
          - "不得早于 from_date。"
        repair: ["ask_clarification", "validate_before_execute"]
      filters:
        source: "Runtime Builder"
        constraints:
          - "必须由编排层生成或白名单校验。"
        repair: ["validate_before_execute"]

  erpnext.accounting.search_payment_terms:
    purpose: "L0：查询付款条件或付款条件模板，用于发票草稿编排。"
    expose: agent_visible
    allowed_roles: ["财务"]
    confirm: none
    backend_mapping:
      doctypes: ["Payment Term", "Payment Terms Template"]
    audit_fields: ["doctype", "query", "filters", "limit"]
    repair: ["resolve_entity", "ask_clarification", "present_candidates", "validate_before_execute", "permission_denied", "erpnext_validation_error"]
    business_contract:
      - "仅用于读取付款条件主数据，不创建或修改付款条件。"
      - "doctype 只能是 Payment Term 或 Payment Terms Template。"
      - "query 只能作为检索输入；命中多个模板时必须展示候选。"
    parameters:
      doctype:
        source: "Runtime 默认 / 用户选择"
        constraints:
          - "默认 Payment Term；只能使用 schema 枚举值。"
        repair: ["validate_before_execute"]
      query:
        source: "用户原话"
        resolver: payment_terms
        constraints:
          - "仅作为检索输入，不能直接当成 ERPNext 主键。"
        repair: ["resolve_entity", "present_candidates"]
      filters:
        source: "Runtime Builder"
        constraints:
          - "必须由编排层生成或白名单校验。"
        repair: ["validate_before_execute"]
      fields:
        source: "Runtime 默认 / Field Resolver"
        resolver: field
        constraints:
          - "字段必须存在于目标 DocType meta。"
        repair: ["validate_before_execute"]

  erpnext.accounting.search_tax_templates:
    purpose: "L0：查询销售/采购税费模板，用于发票税行准备。"
    expose: agent_visible
    allowed_roles: ["财务"]
    confirm: none
    backend_mapping:
      doctypes: ["Sales Taxes and Charges Template", "Purchase Taxes and Charges Template"]
    audit_fields: ["template_type", "query", "company", "tax_category", "disabled", "limit"]
    repair: ["resolve_entity", "ask_clarification", "present_candidates", "inject_context", "validate_before_execute", "permission_denied", "erpnext_validation_error"]
    business_contract:
      - "仅用于读取税费模板，不创建或修改税费模板。"
      - "template_type 必须与目标发票类型一致；销售发票使用 sales，采购发票使用 purchase。"
      - "company 必须解析成 ERPNext Company.name 全称。"
      - "命中多个税费模板时必须展示候选，不允许模型自行选择。"
    parameters:
      template_type:
        source: "发票类型 / Runtime 推断"
        constraints:
          - "只能使用 schema 枚举值。"
        repair: ["ask_clarification", "validate_before_execute"]
      query:
        source: "用户原话"
        resolver: tax_template
        constraints:
          - "仅作为检索输入，不能直接当成税费模板主键。"
        repair: ["resolve_entity", "present_candidates"]
      company:
        source: "Company Resolver / Runtime Context"
        resolver: company
        constraints:
          - "必须是 ERPNext Company.name 全称。"
        repair: ["inject_context", "resolve_entity"]
      tax_category:
        source: "Tax Category Resolver / 用户选择"
        resolver: tax_category
        constraints:
          - "如作为筛选条件，必须来自 ERPNext 主数据或已校验上下文。"
        repair: ["resolve_entity", "present_candidates"]
      disabled:
        source: "用户选择 / Runtime 默认"
      filters:
        source: "Runtime Builder"
        constraints:
          - "必须由编排层生成或白名单校验。"
        repair: ["validate_before_execute"]

  erpnext.accounting.get_report_filters:
    purpose: "L0：读取标准财务报表的过滤器契约，不运行报表。"
    expose: agent_visible
    allowed_roles: ["财务", "管理层"]
    confirm: none
    backend_mapping:
      doctypes: ["Report"]
      reports: ["General Ledger", "Accounts Receivable", "Accounts Payable", "Trial Balance", "Balance Sheet", "Profit and Loss Statement", "Cash Flow"]
    audit_fields: ["report_name"]
    repair: ["ask_clarification", "validate_before_execute", "permission_denied", "erpnext_validation_error"]
    business_contract:
      - "只读取报表过滤器契约，不运行报表、不读取财务数据行。"
      - "report_name 必须使用 schema 枚举值。"
      - "用于在运行报表前收集 company、date、fiscal_year、account、party 等 resolver 结果。"
    parameters:
      report_name:
        required: yes
        source: "用户选择 / Runtime 枚举"
        constraints:
          - "只能使用 schema 枚举值。"
        repair: ["ask_clarification", "validate_before_execute"]

  erpnext.accounting.general_ledger:
    purpose: "L0：运行 General Ledger 只读报表。"
    expose: agent_visible
    allowed_roles: ["财务", "管理层"]
    confirm: none
    backend_mapping:
      reports: ["General Ledger"]
      notes: "run_report 只读；必填 company。"
    audit_fields: ["company", "from_date", "to_date", "account", "party_type", "party"]
    repair: ["resolve_entity", "ask_clarification", "present_candidates", "inject_context", "validate_before_execute", "permission_denied", "erpnext_validation_error"]
    business_contract:
      - "只读运行总账报表，不创建、不修改、不提交任何财务单据。"
      - "company 必填且必须由 Company Resolver 或 Runtime Context 提供。"
      - "from_date/to_date 必须是明确 ISO 日期；to_date 不得早于 from_date。"
      - "account、party 必须解析为 ERPNext 主键；命中多个候选时必须展示候选。"
    parameters:
      company:
        required: yes
        source: "Company Resolver / Runtime Context"
        resolver: company
        constraints:
          - "必须是 ERPNext Company.name 全称。"
        repair: ["inject_context", "resolve_entity"]
      from_date:
        source: "Date Resolver"
        resolver: date
        constraints:
          - "必须是 ISO 日期。"
        repair: ["ask_clarification", "inject_context"]
      to_date:
        source: "Date Resolver"
        resolver: date
        constraints:
          - "必须是 ISO 日期。"
          - "不得早于 from_date。"
        repair: ["ask_clarification", "validate_before_execute"]
      account:
        source: "Account Resolver"
        resolver: account
        constraints:
          - "必须是 ERPNext Account.name 全称。"
        repair: ["resolve_entity", "present_candidates", "ask_clarification"]
      party_type:
        source: "用户选择 / Runtime 推断"
        constraints:
          - "使用 ERPNext 支持的 party_type；当前 schema 未枚举，执行前需校验。"
        repair: ["ask_clarification", "validate_before_execute"]
      party:
        source: "Party Resolver"
        resolver: party
        constraints:
          - "必须与 party_type 匹配，解析为 Customer/Supplier 等 ERPNext 主键。"
        repair: ["resolve_entity", "present_candidates", "ask_clarification"]
      filters:
        source: "Runtime Builder"
        constraints:
          - "可包含 voucher_no、cost_center、project 等已校验筛选；禁止模型直接拼 filter DSL。"
          - "如果包含 cost_center，必须来自 Cost Center Resolver。"
        repair: ["validate_before_execute", "resolve_entity"]

  erpnext.accounting.accounts_receivable:
    purpose: "L0：运行 Accounts Receivable 只读报表。"
    expose: agent_visible
    allowed_roles: ["财务", "管理层"]
    confirm: none
    backend_mapping:
      reports: ["Accounts Receivable"]
      notes: "run_report 只读；必填 company。"
    audit_fields: ["company", "from_date", "to_date", "party"]
    repair: ["resolve_entity", "ask_clarification", "present_candidates", "inject_context", "validate_before_execute", "permission_denied", "erpnext_validation_error"]
    business_contract:
      - "只读运行应收账款报表，不创建、不修改、不提交任何财务单据。"
      - "company 必填且必须由 Company Resolver 或 Runtime Context 提供。"
      - "party 如填写，必须解析为 ERPNext Customer.name。"
      - "默认口径：ToolCall 统一接收 from_date/to_date；应收报表执行时用 to_date 映射 ERPNext report_date，并把 from_date 作为账龄/期间过滤上下文。"
    parameters:
      company:
        required: yes
        source: "Company Resolver / Runtime Context"
        resolver: company
        constraints:
          - "必须是 ERPNext Company.name 全称。"
        repair: ["inject_context", "resolve_entity"]
      from_date:
        source: "Date Resolver"
        resolver: date
        constraints:
          - "必须是 ISO 日期；日期口径需与报表 filter spec 对齐。"
        repair: ["ask_clarification", "validate_before_execute"]
      to_date:
        source: "Date Resolver"
        resolver: date
        constraints:
          - "必须是 ISO 日期；日期口径需与报表 filter spec 对齐。"
        repair: ["ask_clarification", "validate_before_execute"]
      party:
        source: "Customer Resolver"
        resolver: customer
        constraints:
          - "必须是 ERPNext Customer.name。"
        repair: ["resolve_entity", "present_candidates", "ask_clarification"]
      filters:
        source: "Runtime Builder"
        constraints:
          - "可包含 customer、customer_group、payment_terms_template 等已校验筛选。"
          - "禁止模型直接拼 filter DSL。"
        repair: ["validate_before_execute", "resolve_entity"]

  erpnext.accounting.accounts_payable:
    purpose: "L0：运行 Accounts Payable 只读报表。"
    expose: agent_visible
    allowed_roles: ["财务", "管理层"]
    confirm: none
    backend_mapping:
      reports: ["Accounts Payable"]
      notes: "run_report 只读；必填 company。"
    audit_fields: ["company", "from_date", "to_date", "party"]
    repair: ["resolve_entity", "ask_clarification", "present_candidates", "inject_context", "validate_before_execute", "permission_denied", "erpnext_validation_error"]
    business_contract:
      - "只读运行应付账款报表，不创建、不修改、不提交任何财务单据。"
      - "company 必填且必须由 Company Resolver 或 Runtime Context 提供。"
      - "party 如填写，必须解析为 ERPNext Supplier.name。"
      - "默认口径：ToolCall 统一接收 from_date/to_date；应付报表执行时用 to_date 映射 ERPNext report_date，并把 from_date 作为账龄/期间过滤上下文。"
    parameters:
      company:
        required: yes
        source: "Company Resolver / Runtime Context"
        resolver: company
        constraints:
          - "必须是 ERPNext Company.name 全称。"
        repair: ["inject_context", "resolve_entity"]
      from_date:
        source: "Date Resolver"
        resolver: date
        constraints:
          - "必须是 ISO 日期；日期口径需与报表 filter spec 对齐。"
        repair: ["ask_clarification", "validate_before_execute"]
      to_date:
        source: "Date Resolver"
        resolver: date
        constraints:
          - "必须是 ISO 日期；日期口径需与报表 filter spec 对齐。"
        repair: ["ask_clarification", "validate_before_execute"]
      party:
        source: "Supplier Resolver"
        resolver: supplier
        constraints:
          - "必须是 ERPNext Supplier.name。"
        repair: ["resolve_entity", "present_candidates", "ask_clarification"]
      filters:
        source: "Runtime Builder"
        constraints:
          - "可包含 supplier、supplier_group、payment_terms_template 等已校验筛选。"
          - "禁止模型直接拼 filter DSL。"
        repair: ["validate_before_execute", "resolve_entity"]

  erpnext.accounting.financial_report:
    purpose: "L0：运行 Trial Balance、Balance Sheet、Profit and Loss Statement 或 Cash Flow 只读报表。"
    expose: agent_visible
    allowed_roles: ["财务", "管理层"]
    confirm: none
    backend_mapping:
      reports: ["Trial Balance", "Balance Sheet", "Profit and Loss Statement", "Cash Flow"]
      notes: "run_report 只读；必填 company。"
    audit_fields: ["report_name", "company", "from_date", "to_date", "fiscal_year"]
    repair: ["resolve_entity", "ask_clarification", "present_candidates", "inject_context", "validate_before_execute", "permission_denied", "erpnext_validation_error"]
    business_contract:
      - "只读运行财务报表，不创建、不修改、不提交任何财务单据。"
      - "company 必填且必须由 Company Resolver 或 Runtime Context 提供。"
      - "report_name 必须使用 schema 枚举值。"
      - "fiscal_year、日期和 filters 中的 cost_center 必须来自 resolver 或已校验上下文。"
      - "默认口径：财务报表 ToolCall 统一接收 from_date/to_date，报表适配层负责映射为 ERPNext 所需的 period_start_date/period_end_date、from_fiscal_year/to_fiscal_year 或 filters 字段。"
    parameters:
      report_name:
        required: yes
        source: "用户选择 / Runtime 枚举"
        constraints:
          - "只能使用 schema 枚举值。"
        repair: ["ask_clarification", "validate_before_execute"]
      company:
        required: yes
        source: "Company Resolver / Runtime Context"
        resolver: company
        constraints:
          - "必须是 ERPNext Company.name 全称。"
        repair: ["inject_context", "resolve_entity"]
      from_date:
        source: "Date Resolver"
        resolver: date
        constraints:
          - "必须是 ISO 日期；具体映射需与报表 filter spec 对齐。"
        repair: ["ask_clarification", "validate_before_execute"]
      to_date:
        source: "Date Resolver"
        resolver: date
        constraints:
          - "必须是 ISO 日期；具体映射需与报表 filter spec 对齐。"
          - "不得早于 from_date。"
        repair: ["ask_clarification", "validate_before_execute"]
      fiscal_year:
        source: "Fiscal Year Resolver / Date Resolver"
        resolver: fiscal_year
        constraints:
          - "必须是 ERPNext Fiscal Year.name。"
        repair: ["resolve_entity", "present_candidates", "ask_clarification"]
      filters:
        source: "Runtime Builder"
        constraints:
          - "可包含 finance_book、cost_center、project、periodicity 等已校验筛选。"
          - "如果包含 cost_center，必须来自 Cost Center Resolver。"
          - "禁止模型直接拼 filter DSL。"
        repair: ["validate_before_execute", "resolve_entity"]

  erpnext.accounting.create_journal_entry_draft:
