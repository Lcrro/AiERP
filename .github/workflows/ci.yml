name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q src scripts

      - name: Run non-integration regression
        shell: pwsh
        run: python -m pytest -q -m "not integration and not llm and not erpnext_write and not slow"

      - name: Validate project context and documentation
        shell: pwsh
        run: |
          python scripts/dev/project_context.py snapshot
          python scripts/dev/project_context.py audit-docs
          python scripts/dev/project_context.py check
